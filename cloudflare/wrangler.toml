name = "cctv-roster-security-preview"
main = "worker.js"
compatibility_date = "2026-10-12"

# Create a KV namespace in the Cloudflare dashboard, then replace this placeholder
# with its ID. Do not commit real passwords or session secrets to this file.
[[kv_namespaces]]
binding = "ROSTER_DATA"
id = "REPLACE_WITH_CLOUDFLARE_KV_NAMESPACE_ID"

[vars]
ALLOWED_ORIGINS = "https://toxinhub.github.io"
