<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="description" content="CCTV - PJL duty roster">
<title>Duty Roster • CCTV - PJL</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css?v=20260925-ink-balance-2">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="CCTV PJL Duty Roster">
      <span class="brand-mark">C</span>
      <span class="brand-copy"><strong>CCTV · PJL</strong></span>
    </a>
    <div class="top-actions">
      <span class="status-live"><i></i> LIVE BOARD</span>
      <button class="icon-btn" id="theme" aria-label="ইঙ্ক মোডে পরিবর্তন" title="Ink Mode">☀</button>
      <a class="admin-link" href="admin.html">Admin ↗</a>
    </div>
  </header>

  <main>
    <section class="intro">
      <div>
        <button class="today-jump" id="todayJump" type="button" aria-label="আজকের রোস্টারে যান">লোড হচ্ছে…</button>
      </div>
      <div class="intro-meta">
        <span>UPDATED</span>
        <b id="updated">—</b>
      </div>
    </section>

    <section class="board">
      <div class="board-head">
        <div>
          <h2 id="duty-roster-title"><span aria-hidden="true">|</span> ডিউটি রোস্টার</h2>
        </div>
        <div id="legend" class="legend"></div>
      </div>
      <div class="roster-wrap" id="roster"></div>
    </section>

    <section class="next-duty" aria-label="পরবর্তী ডিউটি">
      <div id="next-duty" class="next-duty-list"></div>
    </section>
  </main>
<footer class="site-footer" aria-label="Project note">
  <div class="footer-fun">Just a fun little project made out of curiosity for the crew—<br>still under construction.</div>
</footer>
</div>
<div id="toast" class="toast"></div>

<script>
let DATA=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dhakaClockFormatter=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dhaka',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const dhakaDateTimeFormatter=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const dhakaDateFormatter=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit'});
const today=()=>dhakaDateFormatter.format(new Date());
const timeLabel=d=>{if(!d)return '—';const date=new Date(d);if(Number.isNaN(date.getTime()))return '—';return date.toLocaleString('bn-BD',{timeZone:'Asia/Dhaka',dateStyle:'medium',timeStyle:'short'});};
function applyTheme(){const inkMode=localStorage.getItem('roster-display-mode')==='ink';document.body.classList.toggle('ink-mode',inkMode);$('theme').textContent=inkMode?'☀':'☀';$('theme').setAttribute('aria-label',inkMode?'লাইট মোডে পরিবর্তন':'ইঙ্ক মোডে পরিবর্তন');$('theme').setAttribute('title',inkMode?'Light Mode':'Ink Mode');}
function toast(m,e=false){const t=$('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2800);}
async function load(){try{const r=await fetch('schedule.json?v='+Date.now());if(!r.ok)throw Error();DATA=await r.json();render();}catch{toast('রোস্টার লোড করা যায়নি',true);}}
function updateDateProgress(){const btn=$('todayJump');if(!btn)return;const parts=dhakaClockFormatter.formatToParts(new Date());const get=k=>Number(parts.find(x=>x.type===k)?.value||0);let hour=get('hour');if(hour===24)hour=0;const elapsed=(hour*3600)+(get('minute')*60)+get('second');const remaining=86400-elapsed;const percent=Math.max(0,Math.min(100,(remaining/86400)*100));btn.style.setProperty('--day-remaining',percent.toFixed(4)+'%');}
function render(){
  const days=DATA.days||[],people=DATA.employees||[],types=DATA.shiftTypes||{},now=today(),cols=Math.max(days.length,1),gridStyle='grid-template-columns:repeat('+cols+',minmax(78px,1fr));';
  const todayDateObj=new Date(now+'T12:00:00');
  const todayLabel=todayDateObj.toLocaleDateString('en-US',{day:'2-digit',month:'short',weekday:'short'}).replace(',', ' ·').toUpperCase();
  $('todayJump').textContent=todayLabel;$('todayJump').dataset.iso=now;updateDateProgress();$('updated').textContent=timeLabel(DATA.updatedAt);
  const dhakaHour=Number(dhakaClockFormatter.formatToParts(new Date()).find(p=>p.type==='hour')?.value||0);const activeShift=dhakaHour>=6&&dhakaHour<14?'A':dhakaHour>=14&&dhakaHour<22?'B':'C';
  $('legend').innerHTML=Object.entries(types).map(([k,v])=>{const note=(v.note||'').replace(/–/g,' - '),active=k===activeShift?' active-shift':'',tone=' shift-'+String(k).toLowerCase();return '<span class="'+(active+tone).trim()+'"><i style="--c:'+esc(v.color||'#64748b')+'"></i><b>'+esc(k)+'</b><small><strong class="legend-dash">·</strong>'+esc(note)+'</small></span>';}).join('');
  const head=days.map(d=>{const isToday=d.isoDate===now,dateObj=new Date(d.isoDate+'T12:00:00'),dayNo=dateObj.getDay(),weekStart=dayNo===5,weekEnd=dayNo===4;return '<div class="day-head '+(isToday?'is-today ':'')+(weekStart?'week-start ':'')+(weekEnd?'week-end':'')+'" data-iso="'+esc(d.isoDate)+'"><span>'+esc(d.weekday||'')+'</span><strong>'+esc(d.date||'')+'</strong>'+(isToday?'<em>আজ</em>':'')+'</div>';}).join('');
  const dhakaNow=new Date(),dhakaParts=dhakaDateTimeFormatter.formatToParts(dhakaNow),part=k=>dhakaParts.find(x=>x.type===k)?.value||'00',liveDate=part('year')+'-'+part('month')+'-'+part('day'),liveMinutes=Number(part('hour'))*60+Number(part('minute')),todayIndex=days.findIndex(d=>d.isoDate===liveDate);
  const shiftStartMinutes={A:360,B:840,C:1320};
  const toUtcMs=(isoDate,minutes)=>{const[y,m,d]=isoDate.split('-').map(Number),base=Date.UTC(y,m-1,d,0,0,0);return base+(minutes-360)*60000;};
  const addDays=(isoDate,n)=>{const[y,m,d]=isoDate.split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d+n,12,0,0));return dt.toISOString().slice(0,10);};
  const occurrence=(index,code)=>{if(index<0||index>=days.length||!['A','B','C'].includes(code))return null;const date=days[index].isoDate,startMs=toUtcMs(date,shiftStartMinutes[code]),endMs=startMs+8*60*60000;return{index,code,date,startMs,endMs,endDate:addDays(date,code==='C'?1:0)};};
  const nowMs=toUtcMs(liveDate,liveMinutes);
  const rows=people.map(p=>{
    const cells=days.map((d,di)=>{const code=p.shifts?.[di]||'—',type=types[code]||{},isToday=d.isoDate===now,dateObj=new Date(d.isoDate+'T12:00:00'),dayNo=dateObj.getDay(),weekStart=dayNo===5,weekEnd=dayNo===4;return '<div class="shift-cell '+(isToday?'is-today ':'')+(weekStart?'week-start ':'')+(weekEnd?'week-end':'')+'"><span class="shift shift-'+String(code).toLowerCase()+'" style="--c:'+esc(type.color||'#64748b')+'"><b>'+esc(code)+'</b></span></div>';}).join('');
    const assigned=[];for(let i=0;i<days.length;i++){const code=p.shifts?.[i];if(['A','B','C'].includes(code))assigned.push(occurrence(i,code));}
    let active=null;for(const occ of assigned){if(nowMs>=occ.startMs&&nowMs<occ.endMs){active=occ;break;}}
    let previous=null,next=null;if(active){const pos=assigned.indexOf(active);previous=pos>0?assigned[pos-1]:null;next=pos>=0&&pos<assigned.length-1?assigned[pos+1]:null;}else{for(const occ of assigned){if(occ.startMs>nowMs){next=occ;break;}}for(let i=assigned.length-1;i>=0;i--){if(assigned[i].endMs<=nowMs){previous=assigned[i];break;}}}
    let status='OFF',statusText='OFF',displayCode='OFF';
    if(active){const isDouble=previous&&previous.endMs===active.startMs;status='ON DUTY';statusText=isDouble?'ON DUTY (DOUBLE DUTY) - '+previous.code+' → '+active.code:'ON DUTY - '+active.code;displayCode=active.code;}
    else{const currentCode=todayIndex>=0?(p.shifts?.[todayIndex]||'OFF'):'OFF',todayOccurrence=todayIndex>=0&&['A','B','C'].includes(currentCode)?occurrence(todayIndex,currentCode):null;
      if(todayOccurrence&&nowMs<todayOccurrence.startMs){status='UPCOMING';statusText='UPCOMING - '+todayOccurrence.code;displayCode=todayOccurrence.code;}
      else{const isAssignedToday=['A','B','C'].includes(currentCode),tomorrowIso=addDays(liveDate,1),nextIsTomorrow=next&&next.date===tomorrowIso,isNoShiftDay=currentCode==='OFF'||currentCode==='L',hoursUntilNext=next?(next.startMs-nowMs)/(60*60000):Infinity;
        if(isAssignedToday&&nextIsTomorrow){status='UPCOMING';statusText='UPCOMING - '+next.code;displayCode=next.code;}
        else if(isNoShiftDay&&next&&hoursUntilNext>0&&hoursUntilNext<=4){status='UPCOMING';statusText='UPCOMING - '+next.code;displayCode=next.code;}
        else if(currentCode==='L'){status='OFF';statusText='LEAVE';displayCode='L';}
        else{status='OFF';statusText='OFF';displayCode='OFF';}
      }
    }
    const displayType=types[displayCode]||{},statusColor=displayType.color||types.OFF?.color||'#64748b';const statusHtml='<span class="duty-status status-'+status.toLowerCase().replace(/\s+/g,'-')+(status==='ON DUTY'?' is-active':'')+'" style="--status-color:'+esc(statusColor)+'"><b>'+esc(statusText)+'</b></span>';
    return '<div class="person-row"><div class="person"><div class="person-name"><strong>'+esc(p.name)+'</strong>'+(status==='ON DUTY'?'<i class="name-active-dot" style="--status-color:'+esc(statusColor)+'" aria-hidden="true"></i>':'')+'</div>'+statusHtml+'</div><div class="days" style="'+gridStyle+'">'+cells+'</div></div>';
  }).join('');
  const firstRosterRender=!$('roster').classList.contains('staggered-in');$('roster').innerHTML='<div class="day-grid"><div class="person-head" aria-label="CCTV">📹</div><div class="days" style="'+gridStyle+'">'+head+'</div></div>'+rows;if(firstRosterRender){requestAnimationFrame(()=>requestAnimationFrame(()=>$('roster').classList.add('staggered-in')));}

  const nextInfo=people.map(p=>{
    const shifts=p.shifts||[],current=todayIndex>=0?(shifts[todayIndex]||'OFF'):'OFF',workCodes=['A','B','C'];
    // Leave must remain Leave in the next-duty panel; it must never be
    // collapsed into OFF when today's assignment is L.
    if(current==='L') return {name:p.name,code:'L',kind:'LEAVE',label:'LEAVE',date:liveDate,index:todayIndex};
    let candidate=null;
    for(let i=Math.max(todayIndex,0);i<days.length;i++){const code=shifts[i];if(workCodes.includes(code)){candidate={name:p.name,code,date:days[i].isoDate,index:i,kind:'SHIFT'};break;}if(i===todayIndex&&code==='L'){candidate={name:p.name,code:'L',kind:'LEAVE',label:'LEAVE',date:days[i].isoDate,index:i};break;}}
    if(!candidate){for(let i=0;i<days.length;i++){const code=shifts[i];if(workCodes.includes(code)){candidate={name:p.name,code,date:days[i].isoDate,index:i,kind:'SHIFT'};break;}}}
    return candidate||{name:p.name,code:'OFF',kind:'OFF',label:'OFF',date:liveDate,index:todayIndex};
  });
  $('next-duty').innerHTML=nextInfo.map(x=>{const type=types[x.code]||{},label=x.kind==='LEAVE'?'LEAVE':x.kind==='OFF'?'OFF':x.code,day=x.date===liveDate?'আজ':new Date(x.date+'T12:00:00').toLocaleDateString('bn-BD',{weekday:'long'});return '<div class="next-duty-item"><strong>'+esc(x.name)+'</strong><span class="next-duty-status" style="--c:'+esc(type.color||'#64748b')+'">'+esc(label)+'</span><small>'+esc(day)+'</small></div>';}).join('');
}
$('todayJump').addEventListener('click',()=>{const el=document.querySelector('.day-head.is-today');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});});
$('theme').addEventListener('click',()=>{const next=localStorage.getItem('roster-display-mode')==='ink'?'light':'ink';localStorage.setItem('roster-display-mode',next);applyTheme();});
applyTheme();load();setInterval(()=>{if(DATA){render();}else load();},30000);setInterval(updateDateProgress,1000);
</script>
</body>
</html>
