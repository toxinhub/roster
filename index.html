<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="description" content="CCTV - PJL duty roster">
<title>Duty Roster • CCTV - PJL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="CCTV PJL Duty Roster">
      <span class="brand-mark">C</span>
      <span class="brand-copy"><strong>CCTV · PJL</strong><small>Duty Control</small></span>
    </a>
    <div class="top-actions">
      <span class="status-live"><i></i> LIVE BOARD</span>
      <button class="icon-btn" id="theme" aria-label="থিম পরিবর্তন">☾</button>
      <a class="admin-link" href="admin.html">Admin ↗</a>
    </div>
  </header>

  <main>
    <section class="intro">
      <div>
        <span class="kicker">OPERATIONS / ROSTER</span>
        <h1 id="month">লোড হচ্ছে…</h1>
      </div>
      <div class="intro-meta">
        <span>UPDATED</span>
        <b id="updated">—</b>
      </div>
    </section>

    <section class="board">
      <div class="board-head">
        <div>
          <span class="kicker">DUTY MATRIX</span>
          <h2>ডিউটি রোস্টার</h2>
        </div>
        <div id="legend" class="legend"></div>
      </div>
      <div class="roster-wrap" id="roster"></div>
    </section>
  </main>

  <footer>
    <span class="fun-footer">Just a fun little project · made for the crew</span>
    <span class="fun-footer">Built with ☕ &amp; curiosity</span>
  </footer>
</div>
<div id="toast" class="toast"></div>

<script>
let DATA=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Dhaka'});
const timeLabel=d=>{
  if(!d) return '—';
  const date=new Date(d);
  if(Number.isNaN(date.getTime())) return '—';
  return date.toLocaleString('bn-BD',{timeZone:'Asia/Dhaka',dateStyle:'medium',timeStyle:'short'});
};

function applyTheme(){
  const dark=localStorage.getItem('roster-theme')==='dark';
  document.body.classList.toggle('dark',dark);
  $('theme').textContent=dark?'☀':'☾';
}

function toast(m,e=false){
  const t=$('toast');
  t.textContent=m;
  t.className='toast show'+(e?' err':'');
  setTimeout(()=>t.className='toast',2800);
}

async function load(){
  try{
    const r=await fetch('schedule.json?v='+Date.now());
    if(!r.ok) throw Error();
    DATA=await r.json();
    render();
  }catch{
    toast('রোস্টার লোড করা যায়নি',true);
  }
}

function render(){
  const days=DATA.days||[];
  const people=DATA.employees||[];
  const types=DATA.shiftTypes||{};
  const now=today();
  const cols=Math.max(days.length,1);
  const gridStyle='grid-template-columns:repeat('+cols+',minmax(78px,1fr));';

  $('month').textContent=DATA.month||'Duty Roster';
  $('updated').textContent=timeLabel(DATA.updatedAt);

  $('legend').innerHTML=Object.entries(types).map(([k,v])=>
    '<span><i style="--c:'+esc(v.color||'#64748b')+'"></i><b>'+esc(k)+'</b><small>'+esc(v.note||'')+'</small></span>'
  ).join('');

  const head=days.map(d=>{
    const isToday=d.isoDate===now;
    return '<div class="day-head '+(isToday?'is-today':'')+'">'+
      '<span>'+esc(d.weekday||'')+'</span>'+
      '<strong>'+esc(d.date||'')+'</strong>'+
      (isToday?'<em>আজ</em>':'')+
    '</div>';
  }).join('');

  const rows=people.map(p=>{
    const cells=days.map((d,di)=>{
      const code=p.shifts?.[di]||'—';
      const type=types[code]||{};
      const isToday=d.isoDate===now;
      return '<div class="shift-cell '+(isToday?'is-today':'')+'">'+
        '<span class="shift" style="--c:'+esc(type.color||'#64748b')+'">'+
          '<b>'+esc(code)+'</b>'+
        '</span>'+
      '</div>';
    }).join('');

    return '<div class="person-row">'+
      '<div class="person"><strong>'+esc(p.name)+'</strong></div>'+
      '<div class="days" style="'+gridStyle+'">'+cells+'</div>'+
    '</div>';
  }).join('');

  $('roster').innerHTML=
    '<div class="day-grid">'+
      '<div class="person-head" aria-label="CCTV">📹</div>'+
      '<div class="days" style="'+gridStyle+'">'+head+'</div>'+
    '</div>'+rows;
}

$('theme').onclick=()=>{
  localStorage.setItem('roster-theme',document.body.classList.contains('dark')?'light':'dark');
  applyTheme();
};

applyTheme();
load();
</script>
</body>
</html>
