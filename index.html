<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="description" content="CCTV - PJL duty roster">
<title>Duty Roster • CCTV - PJL</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="CCTV PJL Duty Roster">
      <span class="brand-mark">C</span>
      <span class="brand-copy"><strong>CCTV · PJL</strong></span>
    </a>
    <div class="top-actions">
      <span class="status-live"><i></i> LIVE BOARD</span>
      <button class="icon-btn" id="theme" aria-label="থিম পরিবর্তন">☾</button>
      <a class="admin-link" href="admin.html">Admin ↗</a>
    </div>
  </header>

  <main>
    <section class="intro">
      <div>
        <h1 id="month">লোড হচ্ছে…</h1>
      </div>
      <div class="intro-meta">
        <span>UPDATED</span>
        <b id="updated">—</b>
      </div>
    </section>

    <section class="board">
      <div class="board-head">
        <div>
          <h2>ডিউটি রোস্টার</h2>
        </div>
        <div id="legend" class="legend"></div>
      </div>
      <div class="roster-wrap" id="roster"></div>
    </section>

    <section class="upcoming-info" aria-labelledby="upcomingTitle">
      <div class="upcoming-head">
        <div>
          <h2 id="upcomingTitle">পরবর্তী ডিউটি তথ্য</h2>
        </div>
      </div>
      <div class="info-board-grid" id="infoBoardGrid"></div>
    </section>
  </main>
<footer class="site-footer" aria-label="Project note">
  <div class="footer-switch">Switch to desktop view for more information.</div>
  <div class="footer-divider" aria-hidden="true"></div>
  <div class="footer-fun">Just a fun little project made out of curiosity for the crew.</div>
</footer>
</div>
<div id="toast" class="toast"></div>

<script>
let DATA=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Dhaka'});
const timeLabel=d=>{
  if(!d) return '—';
  const date=new Date(d);
  if(Number.isNaN(date.getTime())) return '—';
  return date.toLocaleString('bn-BD',{timeZone:'Asia/Dhaka',dateStyle:'medium',timeStyle:'short'});
};

function applyTheme(){
  const dark=localStorage.getItem('roster-theme')==='dark';
  document.body.classList.toggle('dark',dark);
  $('theme').textContent=dark?'☀':'☾';
}

function toast(m,e=false){
  const t=$('toast');
  t.textContent=m;
  t.className='toast show'+(e?' err':'');
  setTimeout(()=>t.className='toast',2800);
}

async function load(){
  try{
    const r=await fetch('schedule.json?v='+Date.now());
    if(!r.ok) throw Error();
    DATA=await r.json();
    render();
  }catch{
    toast('রোস্টার লোড করা যায়নি',true);
  }
}

function renderUpcomingInfo(){
  const box=$('infoBoardGrid');
  if(!box) return;
  const days=DATA?.days||[];
  const people=DATA?.employees||[];
  const todayIso=today();
  const todayIndex=days.findIndex(d=>d.isoDate===todayIso);

  const formatDay=d=>{
    if(!d) return '—';
    const dt=new Date(d.isoDate+'T12:00:00');
    return dt.toLocaleDateString('bn-BD',{day:'numeric',month:'short'});
  };
  const shiftLabel=code=>({A:'শিফট A',B:'শিফট B',C:'শিফট C',OFF:'অফ ডে',L:'Leave'}[code]||code||'—');

  const cards=people.map(p=>{
    const start=Math.max(todayIndex+1,0);
    let nextChange=null,nextOff=null;
    for(let i=start;i<days.length;i++){
      const code=p.shifts?.[i]||'—';
      if(!nextOff&&(code==='OFF'||code==='L')) nextOff={day:days[i],code};
      if(!nextChange&&['A','B','C'].includes(code)){
        let prevCode=null;
        for(let j=i-1;j>=0;j--){
          const prev=p.shifts?.[j];
          if(['A','B','C'].includes(prev)){prevCode=prev;break;}
        }
        if(prevCode&&prevCode!==code) nextChange={day:days[i],from:prevCode,to:code};
      }
      if(nextChange&&nextOff) break;
    }
    return '<article class="info-card">'+
      '<div class="info-person"><strong>'+esc(p.name)+'</strong><span class="current-shift" style="--current-color:'+esc(((DATA.shiftTypes||{})[p.shifts?.[todayIndex]]||{}).color||"#64748b")+'">বর্তমান: <i aria-hidden="true"></i><b>'+esc(shiftLabel(p.shifts?.[todayIndex]))+'</b></span></div>'+
      '<div class="info-item shift-change"><span class="info-label">পরবর্তী শিফট চেঞ্জ</span>'+
        (nextChange?'<b>'+esc(formatDay(nextChange.day))+'</b><small>'+esc(shiftLabel(nextChange.from))+' → '+esc(shiftLabel(nextChange.to))+'</small>':'<b>—</b><small>আগাম তথ্য নেই</small>')+
      '</div>'+
      '<div class="info-item off-day"><span class="info-label">পরবর্তী অফ ডে</span>'+
        (nextOff?'<b>'+esc(formatDay(nextOff.day))+'</b><small>'+esc(nextOff.code==='L'?'Leave':'নির্ধারিত ছুটি')+'</small>':'<b>—</b><small>আগাম তথ্য নেই</small>')+
      '</div>'+
    '</article>';
  }).join('');
  box.innerHTML=cards||'<div class="info-empty">আগাম ডিউটি তথ্য পাওয়া যাচ্ছে না।</div>';
}

function render(){
  const days=DATA.days||[];
  const people=DATA.employees||[];
  const types=DATA.shiftTypes||{};
  const now=today();
  const cols=Math.max(days.length,1);
  const gridStyle='grid-template-columns:repeat('+cols+',minmax(78px,1fr));';

  $('month').textContent=DATA.month||'Duty Roster';
  $('updated').textContent=timeLabel(DATA.updatedAt);

  $('legend').innerHTML=Object.entries(types).map(([k,v])=>
    '<span><i style="--c:'+esc(v.color||'#64748b')+'"></i><b>'+esc(k)+'</b><small>'+esc(v.note||'')+'</small></span>'
  ).join('');

  const head=days.map(d=>{
    const isToday=d.isoDate===now;
    const dateObj=new Date(d.isoDate+'T12:00:00');
    const dayNo=dateObj.getDay();
    const weekStart=dayNo===5;
    const weekEnd=dayNo===4;
    return '<div class="day-head '+(isToday?'is-today ':'')+(weekStart?'week-start ':'')+(weekEnd?'week-end':'')+'">'+
      '<span>'+esc(d.weekday||'')+'</span>'+
      '<strong>'+esc(d.date||'')+'</strong>'+
      (isToday?'<em>আজ</em>':'')+
    '</div>';
  }).join('');

  const rows=people.map(p=>{
    const cells=days.map((d,di)=>{
      const code=p.shifts?.[di]||'—';
      const type=types[code]||{};
      const isToday=d.isoDate===now;
      const dateObj=new Date(d.isoDate+'T12:00:00');
      const dayNo=dateObj.getDay();
      const weekStart=dayNo===5;
      const weekEnd=dayNo===4;
      return '<div class="shift-cell '+(isToday?'is-today ':'')+(weekStart?'week-start ':'')+(weekEnd?'week-end':'')+'">'+
        '<span class="shift" style="--c:'+esc(type.color||'#64748b')+'">'+
          '<b>'+esc(code)+'</b>'+
        '</span>'+
      '</div>';
    }).join('');

    // Live status: handle overnight C (22:00–06:00), today's upcoming shift,
    // and then the next rostered shift in chronological order.
    const dhakaNow=new Date();
    const dhakaParts=new Intl.DateTimeFormat('en-CA',{
      timeZone:'Asia/Dhaka',year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',hour12:false
    }).formatToParts(dhakaNow);
    const part=k=>dhakaParts.find(x=>x.type===k)?.value||'00';
    const liveDate=part('year')+'-'+part('month')+'-'+part('day');
    const liveMinutes=Number(part('hour'))*60+Number(part('minute'));
    const todayIndex=days.findIndex(d=>d.isoDate===liveDate);
    const currentCode=todayIndex>=0 ? (p.shifts?.[todayIndex]||'—') : '—';
    let status='OFF', statusText='OFF', displayCode=currentCode;

    const shiftTimes={A:[360,840],B:[840,1320],C:[1320,360]};
    const isShiftActive=(code,minutes)=>{
      const range=shiftTimes[code];
      if(!range) return false;
      const [startMin,endMin]=range;

      // Each shift is exactly 8 hours:
      // A = 06:00–13:59, B = 14:00–21:59,
      // C = 22:00–05:59 (the next calendar day).
      // The 00:00–05:59 part of C is handled by yesterday's C above.
      if(code==='C') return minutes>=startMin;

      return minutes>=startMin&&minutes<endMin;
    };

    // A C shift from yesterday remains ON DUTY until 06:00 today.
    if(todayIndex>0 && liveMinutes<360 && p.shifts?.[todayIndex-1]==='C'){
      status='ON DUTY';
      statusText='ON DUTY - C';
      displayCode='C';
    }else if(currentCode==='OFF'){
      status='OFF';
      statusText='OFF';
      displayCode='OFF';
    }else if(currentCode==='L'){
      status='OFF';
      statusText='LEAVE';
      displayCode='L';
    }else if(isShiftActive(currentCode,liveMinutes)){
      status='ON DUTY';
      statusText='ON DUTY - '+currentCode;
      displayCode=currentCode;
    }else{
      const range=shiftTimes[currentCode];
      let nextIndex=-1;

      // If today's shift has not started yet, today's shift is UPCOMING.
      if(range && liveMinutes<range[0]){
        nextIndex=todayIndex;
      }else{
        // Today's shift has ended; find the next A/B/C in the roster.
        for(let i=Math.max(todayIndex+1,0);i<days.length;i++){
          if(['A','B','C'].includes(p.shifts?.[i])){
            nextIndex=i;
            break;
          }
        }
      }

      if(nextIndex>=0){
        const nextCode=p.shifts?.[nextIndex];
        status='UPCOMING';
        statusText='UPCOMING - '+nextCode;
        displayCode=nextCode;
      }else{
        status='OFF';
        statusText='OFF';
        displayCode='OFF';
      }
    }

    const displayType=types[displayCode]||{};
    const statusColor=displayType.color||types.OFF?.color||'#64748b';
    const statusHtml='<span class="duty-status status-'+status.toLowerCase().replace(/\s+/g,'-')+(status==='ON DUTY'?' is-active':'')+'" style="--status-color:'+esc(statusColor)+'"><b>'+esc(statusText)+'</b></span>';

    return '<div class="person-row">'+
      '<div class="person"><div class="person-name"><strong>'+esc(p.name)+'</strong>'+(status==='ON DUTY'?'<i class="name-active-dot" style="--status-color:'+esc(statusColor)+'" aria-hidden="true"></i>':'')+'</div>'+statusHtml+'</div>'+
      '<div class="days" style="'+gridStyle+'">'+cells+'</div>'+
    '</div>';
  }).join('');

  $('roster').innerHTML=
    '<div class="day-grid">'+
      '<div class="person-head" aria-label="CCTV">📹</div>'+
      '<div class="days" style="'+gridStyle+'">'+head+'</div>'+
    '</div>'+rows;
  renderUpcomingInfo();
}

$('theme').onclick=()=>{
  localStorage.setItem('roster-theme',document.body.classList.contains('dark')?'light':'dark');
  applyTheme();
};

applyTheme();
load();
// Recalculate live duty status as shift boundaries are crossed.
setInterval(()=>{ if(DATA) render(); },30000);

(function(){
  const wrap=$('roster');
  if(!wrap) return;

  // Native touch scrolling is intentionally left untouched for zero-lag swipes.
  // Mouse users still get click-and-drag scrolling on desktop.
  if(!window.matchMedia('(pointer:fine)').matches) return;

  let dragging=false;
  let startX=0;
  let startScroll=0;

  const stop=e=>{
    if(!dragging) return;
    dragging=false;
    wrap.classList.remove('is-dragging');
    if(e?.pointerId!=null){
      try{wrap.releasePointerCapture(e.pointerId)}catch{}
    }
  };

  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse' || e.button!==0) return;
    dragging=true;
    startX=e.clientX;
    startScroll=wrap.scrollLeft;
    wrap.classList.add('is-dragging');
    try{wrap.setPointerCapture(e.pointerId)}catch{}
  });

  wrap.addEventListener('pointermove',e=>{
    if(!dragging) return;
    wrap.scrollLeft=startScroll-(e.clientX-startX);
    e.preventDefault();
  },{passive:false});

  wrap.addEventListener('pointerup',stop);
  wrap.addEventListener('pointercancel',stop);
  wrap.addEventListener('lostpointercapture',stop);
})();
</script>
</body>
</html>
