<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e2c2d">
  <meta name="description" content="CCTV - PJL duty roster">
  <title>ডিউটি রোস্টার • CCTV - PJL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="ডিউটি রোস্টার">
        <span class="brand-icon">✓</span>
        <div>
          <strong>ডিউটি রোস্টার</strong>
          <small>CCTV - PJL</small>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="refresh" aria-label="রিফ্রেশ" title="রিফ্রেশ">↻</button>
        <button class="icon-btn" id="theme" aria-label="থিম পরিবর্তন" title="থিম পরিবর্তন">☾</button>
        <a class="back" href="admin.html">এডমিন</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="dashboard-header">
        <div class="header-copy">
          <span class="eyebrow">CCTV OPERATIONS</span>
          <h1>ডিউটি রোস্টার</h1>
          <p>CCTV - PJL</p>
        </div>
        <div class="meta-pill">
          <span class="meta-label">মাস</span>
          <strong id="month">লোড হচ্ছে…</strong>
        </div>
      </section>

      <section class="roster-card">
        <div class="card-head">
          <div>
            <span class="card-kicker">SCHEDULE</span>
            <h2>শিফট তালিকা</h2>
          </div>
          <div class="last-updated" id="updated">লোড হচ্ছে…</div>
        </div>
        <div class="sheet-wrap" id="tableWrap"></div>
        <div id="legend" class="legend"></div>
      </section>
    </main>

    <footer>
      <span>শেষ আপডেট: <b id="footerUpdate">—</b></span>
      <a href="admin.html">এডমিন প্যানেল</a>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    let DATA = null;
    const TODAY = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Dhaka' });
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    const fmt = d => d ? new Date(d).toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka', dateStyle: 'medium', timeStyle: 'short' }) : '—';

    function applyTheme() {
      const dark = localStorage.getItem('roster-theme') === 'dark';
      document.body.classList.toggle('dark', dark);
      $('theme').textContent = dark ? '☀' : '☾';
      $('theme').setAttribute('aria-label', dark ? 'লাইট থিম' : 'ডার্ক থিম');
    }

    async function load() {
      try {
        const r = await fetch('schedule.json?v=' + Date.now());
        if (!r.ok) throw new Error('fetch failed');
        DATA = await r.json();
        render();
      } catch {
        toast('রোস্টার লোড করা যায়নি', true);
      }
    }

    function render() {
      $('month').textContent = DATA.month || '—';
      $('updated').textContent = 'শেষ পরিবর্তন: ' + fmt(DATA.updatedAt);
      $('footerUpdate').textContent = fmt(DATA.updatedAt);

      $('legend').innerHTML = Object.entries(DATA.shiftTypes || {}).map(([k, v]) =>
        `<span><i style="background:${esc(v.color || '#777')}"></i><b>${esc(k)}</b> ${esc(v.label || '')}</span>`
      ).join('');

      const heads = (DATA.days || []).map(d =>
        `<th class="${d.isoDate === TODAY ? 'today' : ''}"><span class="date-head">${esc(d.date)}</span><small>${esc(d.weekday)}</small></th>`
      ).join('');

      const rows = (DATA.employees || []).map(e =>
        `<tr><th class="name-col">${esc(e.name)}</th>${(e.shifts || []).map((c, i) => {
          const s = DATA.shiftTypes[c] || {};
          return `<td class="${DATA.days[i]?.isoDate === TODAY ? 'today' : ''}"><span class="chip" style="--chip:${esc(s.color || '#64748b')}">${esc(c)}</span><small>${esc(s.label || '')}</small></td>`;
        }).join('')}</tr>`
      ).join('');

      $('tableWrap').innerHTML = `<table><thead><tr><th class="name-col">কর্মী</th>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    function toast(message, error = false) {
      const t = $('toast');
      t.textContent = message;
      t.className = 'toast show' + (error ? ' err' : '');
      setTimeout(() => t.className = 'toast', 3000);
    }

    $('refresh').onclick = load;
    $('theme').onclick = () => {
      localStorage.setItem('roster-theme', document.body.classList.contains('dark') ? 'light' : 'dark');
      applyTheme();
    };

    applyTheme();
    load();
  </script>
</body>
</html>
