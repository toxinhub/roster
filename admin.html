<style>
/* Complete Admin UI — based on the supplied PJL roster reference */
html body[data-required-role="admin"]{
  --ui-bg:#f7f9fc;--ui-surface:#fff;--ui-subtle:#f1f5f9;--ui-soft:#f8fafc;
  --ui-ink:#0f172a;--ui-muted:#64748b;--ui-line:#e2e8f0;--ui-line-strong:#cbd5e1;
  --ui-primary:#172033;--ui-blue:#2563eb;--ui-green:#059669;--ui-amber:#d97706;
  --ui-rose:#e11d48;--ui-radius:15px;
  min-height:100%;background:var(--ui-bg)!important;color:var(--ui-ink)!important;
  font-family:Inter,"Hind Siliguri",system-ui,sans-serif!important;
  background-image:none!important;
}
html body[data-required-role="admin"].ink-mode{
  --ui-bg:#111827;--ui-surface:#1f2937;--ui-subtle:#273449;--ui-soft:#182333;
  --ui-ink:#f1f5f9;--ui-muted:#a8b4c5;--ui-line:#37465a;--ui-line-strong:#526176;
  --ui-primary:#e2e8f0;--ui-blue:#60a5fa;--ui-green:#34d399;--ui-amber:#fbbf24;--ui-rose:#fb7185;
}
html body[data-required-role="admin"] *{box-sizing:border-box}
html body[data-required-role="admin"] .app{min-height:100vh;background:transparent!important;color:var(--ui-ink)!important}
html body[data-required-role="admin"] .topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:16px;min-height:72px;height:auto;margin:0;padding:12px max(20px,calc((100vw - 1240px)/2));
  background:var(--ui-surface)!important;border:0;border-bottom:1px solid var(--ui-line);
  border-radius:0;box-shadow:0 2px 8px rgba(15,23,42,.035)!important;
}
html body[data-required-role="admin"] .brand{display:flex;align-items:center;gap:12px;min-width:0}
html body[data-required-role="admin"] .brand-icon{
  display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border-radius:12px;
  background:var(--ui-primary)!important;color:var(--ui-surface)!important;font-size:19px;font-weight:800;
}
html body[data-required-role="admin"] .brand strong{display:block;color:var(--ui-ink)!important;font-size:16px;font-weight:800;letter-spacing:-.025em}
html body[data-required-role="admin"] .brand small{display:block;margin-top:2px;color:var(--ui-muted)!important;font-size:11px;font-weight:500}
html body[data-required-role="admin"] .top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
html body[data-required-role="admin"] .top-actions .back,
html body[data-required-role="admin"] .top-actions .icon-btn,
html body[data-required-role="admin"] .top-actions #status{
  display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;
  border:1px solid var(--ui-line)!important;border-radius:9px;background:var(--ui-surface)!important;
  color:var(--ui-ink)!important;text-decoration:none;font-size:12px;font-weight:700;
}
html body[data-required-role="admin"] .top-actions .icon-btn{width:39px;padding:0;font-size:17px;cursor:pointer}
html body[data-required-role="admin"] .top-actions #status{min-height:27px;padding:4px 9px!important;font-size:10px!important}
html body[data-required-role="admin"] #status.status.connected{background:#ecfdf5!important;color:#047857!important;border-color:#a7f3d0!important}
html body[data-required-role="admin"].ink-mode #status.status.connected{background:#123a31!important;color:#6ee7b7!important;border-color:#23644f!important}
html body[data-required-role="admin"] .page-shell{width:min(100% - 40px,1240px);max-width:1240px;margin:24px auto 42px;padding:0}
html body[data-required-role="admin"] .panel{
  margin:0 0 18px;padding:0;overflow:hidden;background:var(--ui-surface)!important;
  border:1px solid var(--ui-line)!important;border-radius:var(--ui-radius)!important;
  box-shadow:0 5px 22px rgba(15,23,42,.045)!important;color:var(--ui-ink)!important;
}
html body[data-required-role="admin"] .section-head{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin:0;padding:18px 20px;border-bottom:1px solid var(--ui-line);
}
html body[data-required-role="admin"] .section-head h2{margin:2px 0 0;color:var(--ui-ink)!important;font-size:18px;line-height:1.35;font-weight:800;letter-spacing:-.025em}
html body[data-required-role="admin"] .eyebrow{color:var(--ui-muted)!important;font-size:9px;font-weight:800;letter-spacing:.15em}
html body[data-required-role="admin"] .muted{color:var(--ui-muted)!important;font-size:11px;font-weight:700}
html body[data-required-role="admin"] .actions{display:flex;gap:8px;flex-wrap:wrap}
html body[data-required-role="admin"] .actions button,
html body[data-required-role="admin"] #tools button,
html body[data-required-role="admin"] .archive-controls button,
html body[data-required-role="admin"] #addDay{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:39px;padding:8px 14px;
  border:1px solid var(--ui-line-strong)!important;border-radius:9px;background:var(--ui-surface)!important;
  color:var(--ui-ink)!important;font:inherit;font-size:12px;font-weight:750;cursor:pointer;
  transition:background .15s,border-color .15s,transform .15s;
}
html body[data-required-role="admin"] button:hover:not(:disabled){border-color:#94a3b8!important}
html body[data-required-role="admin"] button:active:not(:disabled){transform:translateY(1px)}
html body[data-required-role="admin"] button:disabled{opacity:.48;cursor:not-allowed}
html body[data-required-role="admin"] #addDay,
html body[data-required-role="admin"] #tools #save{
  background:#059669!important;border-color:#059669!important;color:#fff!important;
}
html body[data-required-role="admin"] #tools #save:hover{background:#047857!important}
html body[data-required-role="admin"] .form-grid{
  display:grid;grid-template-columns:minmax(220px,1.2fr) minmax(190px,.8fr);
  gap:12px;margin:18px 20px 8px;max-width:780px;
}
html body[data-required-role="admin"] .form-grid label,
html body[data-required-role="admin"] .roster-tools label,
html body[data-required-role="admin"] .archive-controls label{
  display:grid;gap:6px;color:var(--ui-muted)!important;font-size:11px;font-weight:750;
}
html body[data-required-role="admin"] input,
html body[data-required-role="admin"] select{
  width:100%;min-width:0;min-height:40px;padding:8px 11px;
  border:1px solid var(--ui-line-strong)!important;border-radius:9px;
  background:var(--ui-surface)!important;color:var(--ui-ink)!important;
  font:inherit;font-size:13px;outline:none;
}
html body[data-required-role="admin"] input:focus,
html body[data-required-role="admin"] select:focus{
  border-color:var(--ui-blue)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--ui-blue) 13%,transparent);
}
html body[data-required-role="admin"] .roster-tools{
  display:grid;grid-template-columns:minmax(190px,1.4fr) minmax(120px,.8fr) minmax(125px,.8fr) minmax(135px,.9fr) auto;
  align-items:end;gap:9px;margin:15px 20px 12px;padding:14px;
  border:1px solid var(--ui-line);border-radius:11px;background:var(--ui-soft);
}
html body[data-required-role="admin"] .roster-tools button{
  min-height:40px;padding:8px 14px;border:1px solid var(--ui-primary)!important;
  border-radius:9px;background:var(--ui-primary)!important;color:var(--ui-surface)!important;
  font-size:12px;font-weight:800;cursor:pointer;
}
html body[data-required-role="admin"] .roster-result-count{margin:0 20px 9px;color:var(--ui-muted)!important;font-size:11px}
html body[data-required-role="admin"] .grid-scroll{
  max-height:min(65vh,720px);margin:0 20px;overflow:auto;
  border:1px solid var(--ui-line);border-radius:11px;background:var(--ui-surface);
  overscroll-behavior:contain;scrollbar-width:thin;-webkit-overflow-scrolling:touch;
}
html body[data-required-role="admin"] #editor{
  width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;
  color:var(--ui-ink)!important;font-size:12px;
}
html body[data-required-role="admin"] #editor th,
html body[data-required-role="admin"] #editor td{
  min-width:76px;padding:8px 7px;text-align:center;vertical-align:middle;
  border-right:1px solid var(--ui-line);border-bottom:1px solid var(--ui-line);
  background:var(--ui-surface);color:var(--ui-ink)!important;
}
html body[data-required-role="admin"] #editor thead th{
  position:sticky;top:0;z-index:4;background:var(--ui-soft)!important;color:var(--ui-muted)!important;
}
html body[data-required-role="admin"] #editor th:first-child{
  min-width:170px;text-align:left;background:var(--ui-soft)!important;
}
html body[data-required-role="admin"] #editor tbody th:first-child{
  position:sticky;left:0;z-index:2;background:var(--ui-surface)!important;
}
html body[data-required-role="admin"] #editor thead th:first-child{left:0;z-index:6}
html body[data-required-role="admin"] #editor tbody tr:hover td{background:color-mix(in srgb,var(--ui-blue) 4%,var(--ui-surface))}
html body[data-required-role="admin"] #editor tbody tr[hidden]{display:none}
html body[data-required-role="admin"] #editor input[data-name]{
  width:100%;min-width:0;min-height:34px;padding:5px 7px;border-color:transparent!important;
  background:transparent!important;font-size:12px;font-weight:750;
}
html body[data-required-role="admin"] #editor th.editor-day-heading{min-width:88px!important;padding:9px 6px!important}
html body[data-required-role="admin"] #editor .editor-day-date,
html body[data-required-role="admin"] #editor .editor-day-weekday{
  display:block;width:100%;min-width:72px!important;height:34px!important;min-height:34px!important;
  margin:0 auto 5px;padding:5px 6px!important;border:1px solid var(--ui-line-strong)!important;
  border-radius:7px;background:var(--ui-surface)!important;color:var(--ui-ink)!important;
  font-size:12px!important;font-weight:800!important;text-align:center;
}
html body[data-required-role="admin"] #editor .editor-day-weekday{background:var(--ui-subtle)!important;color:var(--ui-muted)!important}
html body[data-required-role="admin"] #editor .remove{
  min-height:25px;padding:3px 7px;border:1px solid #fecdd3!important;border-radius:6px;
  background:#fff1f2!important;color:#be123c!important;font-size:10px;font-weight:750;cursor:pointer;
}
html body[data-required-role="admin"].ink-mode #editor .remove{background:#48202c!important;color:#fda4af!important;border-color:#854052!important}
html body[data-required-role="admin"] #editor .edit{
  min-width:44px;min-height:40px;padding:7px 9px;border:1px solid transparent!important;
  border-radius:8px;font-size:12px;font-weight:850;cursor:pointer;
  transition:transform .12s,box-shadow .12s;
}
html body[data-required-role="admin"] #editor .edit:hover{transform:translateY(-1px);box-shadow:0 3px 9px rgba(15,23,42,.09)}
html body[data-required-role="admin"] #editor .edit.shift-a,
html body[data-required-role="admin"] .picker .shift-a{background:#eff6ff!important;color:#1d4ed8!important;border-color:#bfdbfe!important}
html body[data-required-role="admin"] #editor .edit.shift-b,
html body[data-required-role="admin"] .picker .shift-b{background:#ecfdf5!important;color:#047857!important;border-color:#a7f3d0!important}
html body[data-required-role="admin"] #editor .edit.shift-c,
html body[data-required-role="admin"] .picker .shift-c{background:#fffbeb!important;color:#b45309!important;border-color:#fde68a!important}
html body[data-required-role="admin"] #editor .edit.shift-off,
html body[data-required-role="admin"] .picker .shift-off{background:#f1f5f9!important;color:#475569!important;border-color:#cbd5e1!important}
html body[data-required-role="admin"] #editor .edit.shift-l,
html body[data-required-role="admin"] .picker .shift-l{background:#fff1f2!important;color:#be123c!important;border-color:#fecdd3!important}
html body[data-required-role="admin"].ink-mode #editor .edit.shift-a,
html body[data-required-role="admin"].ink-mode .picker .shift-a{background:#172b50!important;color:#93c5fd!important;border-color:#31558d!important}
html body[data-required-role="admin"].ink-mode #editor .edit.shift-b,
html body[data-required-role="admin"].ink-mode .picker .shift-b{background:#103b31!important;color:#6ee7b7!important;border-color:#23644f!important}
html body[data-required-role="admin"].ink-mode #editor .edit.shift-c,
html body[data-required-role="admin"].ink-mode .picker .shift-c{background:#49330e!important;color:#fcd34d!important;border-color:#80601d!important}
html body[data-required-role="admin"].ink-mode #editor .edit.shift-off,
html body[data-required-role="admin"].ink-mode .picker .shift-off{background:#343b45!important;color:#cbd5e1!important;border-color:#586271!important}
html body[data-required-role="admin"].ink-mode #editor .edit.shift-l,
html body[data-required-role="admin"].ink-mode .picker .shift-l{background:#48202c!important;color:#fda4af!important;border-color:#854052!important}
html body[data-required-role="admin"] .picker{
  position:fixed;z-index:1000;display:grid;grid-template-columns:repeat(5,minmax(48px,1fr));
  min-width:282px;gap:6px;padding:8px;border:1px solid var(--ui-line);
  border-radius:12px;background:var(--ui-surface);box-shadow:0 16px 42px rgba(15,23,42,.2);
}
html body[data-required-role="admin"] .picker .shift-option{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:58px;padding:7px 4px;border:1px solid var(--ui-line);border-radius:9px;cursor:pointer;
}
html body[data-required-role="admin"] .picker .shift-option strong{font-size:17px;line-height:1}
html body[data-required-role="admin"] .picker .shift-option small{font-size:9px;font-weight:700;line-height:1.2;color:inherit;opacity:.8}
html body[data-required-role="admin"] .picker .shift-option.selected{outline:2px solid currentColor;outline-offset:-3px}
html body[data-required-role="admin"] .editor-meta{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:12px 20px 0;padding:11px 13px;border:1px solid var(--ui-line);
  border-radius:10px;background:var(--ui-soft)!important;
}
html body[data-required-role="admin"] .change-status{font-size:12px;font-weight:750;color:#059669}
html body[data-required-role="admin"] .change-status.dirty{color:#b45309}
html body[data-required-role="admin"] .quiet{padding:6px 9px;border:1px solid var(--ui-line)!important;border-radius:7px;background:var(--ui-surface)!important;color:var(--ui-muted)!important;font-size:11px;font-weight:750;cursor:pointer}
html body[data-required-role="admin"] .change-summary{
  margin:9px 20px 0;padding:11px 13px;border:1px solid #fde68a;border-radius:9px;
  background:#fffbeb;color:#713f12;font-size:12px;line-height:1.6;
}
html body[data-required-role="admin"].ink-mode .change-summary{background:#49330e;color:#fde68a;border-color:#80601d}
html body[data-required-role="admin"] #tools{
  display:flex;justify-content:flex-end;gap:9px;margin:13px 20px 18px;
}
html body[data-required-role="admin"] #tools button{min-width:130px}
html body[data-required-role="admin"] #archive-history .section-head{border-bottom:0}
html body[data-required-role="admin"] .archive-controls{
  display:flex;align-items:end;flex-wrap:wrap;gap:9px;padding:0 20px 15px;
}
html body[data-required-role="admin"] .archive-controls label{min-width:220px;max-width:340px;flex:1}
html body[data-required-role="admin"] .archive-preview{
  margin:0 20px 20px;padding:14px;border:1px solid var(--ui-line);
  border-radius:11px;background:var(--ui-soft)!important;color:var(--ui-ink)!important;
  font-size:12px;line-height:1.65;overflow:hidden;
}
html body[data-required-role="admin"] .archive-preview>strong{font-size:13px}
html body[data-required-role="admin"] .archive-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
html body[data-required-role="admin"] .archive-stat{padding:11px;border:1px solid var(--ui-line);border-radius:9px;background:var(--ui-surface)!important}
html body[data-required-role="admin"] .archive-stat strong{display:block;color:var(--ui-ink)!important;font-size:18px}
html body[data-required-role="admin"] .archive-stat small{color:var(--ui-muted)!important;font-size:10px}
html body[data-required-role="admin"] .archive-shifts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
html body[data-required-role="admin"] .archive-shifts span{padding:5px 8px;border:1px solid var(--ui-line);border-radius:7px;background:var(--ui-surface);font-size:10px;font-weight:800}
html body[data-required-role="admin"] .archive-table-wrap{max-height:min(55vh,520px);margin-top:12px;overflow:auto;border:1px solid var(--ui-line);border-radius:9px;-webkit-overflow-scrolling:touch}
html body[data-required-role="admin"] .archive-table{width:100%;min-width:max-content;border-collapse:separate;border-spacing:0;font-size:11px}
html body[data-required-role="admin"] .archive-table th,
html body[data-required-role="admin"] .archive-table td{padding:8px;border-right:1px solid var(--ui-line);border-bottom:1px solid var(--ui-line);text-align:center;white-space:nowrap;background:var(--ui-surface);color:var(--ui-ink)}
html body[data-required-role="admin"] .archive-table thead th{position:sticky;top:0;z-index:2;background:var(--ui-subtle)}
html body[data-required-role="admin"] .archive-table th:first-child{position:sticky;left:0;z-index:3;min-width:125px;text-align:left;background:var(--ui-surface)}
html body[data-required-role="admin"] .archive-table thead th:first-child{z-index:4;background:var(--ui-subtle)}
html body[data-required-role="admin"] .archive-shift-code{display:inline-block;min-width:25px;padding:4px 6px;border-radius:6px;font-weight:900;background:var(--ui-subtle);color:var(--ui-ink)}
html body[data-required-role="admin"] .archive-shift-code.shift-a{background:#eff6ff;color:#1d4ed8}
html body[data-required-role="admin"] .archive-shift-code.shift-b{background:#ecfdf5;color:#047857}
html body[data-required-role="admin"] .archive-shift-code.shift-c{background:#fffbeb;color:#b45309}
html body[data-required-role="admin"] .archive-shift-code.shift-off{background:#f1f5f9;color:#475569}
html body[data-required-role="admin"] .archive-shift-code.shift-l{background:#fff1f2;color:#be123c}
html body[data-required-role="admin"].ink-mode .archive-shift-code{background:#343b45;color:#e2e8f0}
html body[data-required-role="admin"].ink-mode .archive-shift-code.shift-a{background:#172b50;color:#93c5fd}
html body[data-required-role="admin"].ink-mode .archive-shift-code.shift-b{background:#103b31;color:#6ee7b7}
html body[data-required-role="admin"].ink-mode .archive-shift-code.shift-c{background:#49330e;color:#fcd34d}
html body[data-required-role="admin"].ink-mode .archive-shift-code.shift-l{background:#48202c;color:#fda4af}
html body[data-required-role="admin"] .toast{position:fixed;left:50%;bottom:22px;z-index:1100;transform:translateX(-50%);max-width:min(90vw,520px);padding:11px 16px;border:1px solid var(--ui-line);border-radius:10px;background:var(--ui-primary);color:var(--ui-surface);font-size:12px;box-shadow:0 8px 25px rgba(15,23,42,.18)}
html body[data-required-role="admin"] .toast:not(.show){opacity:0;pointer-events:none;transform:translate(-50%,8px)}
html body[data-required-role="admin"] .toast.err{background:#9f1239;color:#fff;border-color:#9f1239}
html body[data-required-role="admin"] button:focus-visible,
html body[data-required-role="admin"] input:focus-visible,
html body[data-required-role="admin"] select:focus-visible{outline:2px solid var(--ui-blue);outline-offset:2px}

 html body[data-required-role="admin"] .topbar{padding:10px 16px}

 html body[data-required-role="admin"] .actions button,

 html body[data-required-role="admin"] .form-grid label{font-size:10px}

</style></head>
<body data-required-role="admin">
  <div class="app admin-app">
    <header class="topbar">
      <div class="brand" aria-label="রোস্টার এডমিন">
        <span class="brand-icon" aria-hidden="true">R</span>
        <div><strong>রোস্টার এডমিন</strong><small>CCTV - PJL · ডিউটি ব্যবস্থাপনা</small></div>
      </div>
      <div class="top-actions">
        <span id="status" class="status connected">Admin</span>
        <button class="icon-btn" id="theme" type="button" aria-label="থিম পরিবর্তন" title="Ink Mode">☾</button>
        <a class="back" href="index.html">লাইভ রোস্টার ↗</a>
      </div>
    </header>
    <main class="page-shell">
      <section class="panel" id="roster-editor">
        <div class="section-head">
          <div><span class="eyebrow">DUTY ROSTER · EDITOR</span><h2 id="monthHead">রোস্টার সম্পাদনা</h2></div>
          <div class="actions"><button id="addDay" type="button">＋ তারিখ যোগ</button></div>
        </div>
        <div class="form-grid">
          <label>রোস্টারের শিরোনাম<input id="month" maxlength="80"></label>
          <label>মাস ও সাল<input id="monthPicker" type="month"></label>
        </div>
        <div class="roster-tools" aria-label="Roster filters and bulk editing">
          <label>কর্মী খুঁজুন<input id="employeeSearch" type="search" placeholder="নাম লিখুন…" autocomplete="off"></label>
          <label>Shift Filter<select id="shiftFilter"><option value="ALL">সব Shift</option><option value="A">A Shift</option><option value="B">B Shift</option><option value="C">C Shift</option><option value="OFF">OFF</option><option value="L">Leave</option></select></label>
          <label>তারিখ<select id="bulkDate"></select></label>
          <label>নতুন Shift<select id="bulkShift"><option value="">Shift নির্বাচন</option></select></label>
          <button type="button" id="bulkApply">নির্বাচিত Shift প্রয়োগ</button>
        </div>
        <p class="roster-result-count" id="rosterResultCount" aria-live="polite"></p>
        <div class="grid-scroll"><table id="editor"></table></div>
        <div class="editor-meta"><span id="changeStatus" class="change-status clean">● কোনো পরিবর্তন নেই</span><button id="clearChanges" class="quiet" type="button" disabled>পরিবর্তন বাতিল</button></div>
        <div id="changeSummary" class="change-summary" hidden></div>
        <div class="form-row" id="tools"><button class="primary" id="save" type="button">✓ নিরাপদে Save</button><button id="download" type="button">JSON Download ↓</button></div>
      </section>
      <section class="panel" id="archive-history">
        <div class="section-head">
          <div><span class="eyebrow">HISTORY · READ ONLY</span><h2>Archive & History</h2></div>
          <span class="muted">সংরক্ষিত রোস্টার</span>
        </div>
        <div class="form-row archive-controls">
          <label>সংরক্ষিত মাস<select id="archiveMonth" aria-label="সংরক্ষিত Archive মাস"><option value="">Archive তালিকা লোড হচ্ছে…</option></select></label>
          <button id="refreshArchives" type="button">তালিকা রিফ্রেশ ↻</button>
          <button id="downloadArchive" type="button" disabled>JSON Download ↓</button>
        </div>
        <div id="archivePreview" class="archive-preview" role="status" aria-live="polite">সংরক্ষিত Archive খোঁজা হচ্ছে…</div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    let S = null;
    let sha = null;
    let cleanSnapshot = '';
    let dirty = false;
    const archivePending = new Map();
    const $ = id => document.getElementById(id);
    const key = 'cctv_roster_admin';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    function toast(message, error = false) {
      const t = $('toast');
      t.textContent = message;
      t.className = 'toast show' + (error ? ' err' : '');
      setTimeout(() => t.className = 'toast', 3500);
    }

    function applyTheme() {
      const inkMode = localStorage.getItem('roster-display-mode') === 'ink';
      document.body.classList.toggle('ink-mode', inkMode);
      $('theme').textContent = inkMode ? '☀' : '☀';
      $('theme').setAttribute('aria-label', inkMode ? 'লাইট মোড' : 'ইঙ্ক মোড');
      $('theme').setAttribute('title', inkMode ? 'Light Mode' : 'Ink Mode');
      $('theme').setAttribute('aria-label', inkMode ? 'লাইট মোড' : 'ইঙ্ক মোড');
      $('theme').setAttribute('title', inkMode ? 'Light Mode' : 'Ink Mode');
    }

    function syncMonth() {
      const value = $('monthPicker').value;
      if (!value || !S) return;
      const [year, month] = value.split('-').map(Number);
      const monthName = new Intl.DateTimeFormat('bn-BD', { month: 'long', year: 'numeric' }).format(new Date(Date.UTC(year, month - 1, 1)));
      const weekdays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
      const toBangla = n => String(n).replace(/0/g,'০').replace(/1/g,'১').replace(/2/g,'২').replace(/3/g,'৩').replace(/4/g,'৪').replace(/5/g,'৫').replace(/6/g,'৬').replace(/7/g,'৭').replace(/8/g,'৮').replace(/9/g,'৯');
      const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
      const oldDays = Array.isArray(S.days) ? S.days : [];
      const oldEmployees = Array.isArray(S.employees) ? S.employees : [];

      // Keep the latest unsaved snapshot whenever leaving a month.
      // Returning to a pending month restores its actual edits instead of
      // generating a blank roster or trapping the editor on the new month.
      const oldKey = oldDays[0]?.isoDate?.slice(0,7) || '';
      const newKey = value;
      if (oldKey && newKey && oldKey !== newKey) {
        archivePending.set(oldKey, JSON.parse(JSON.stringify(S)));
        if (archivePending.has(newKey)) {
          S = JSON.parse(JSON.stringify(archivePending.get(newKey)));
          archivePending.delete(newKey);
          $('month').value = S.month || '';
          $('monthHead').textContent = S.month || 'রোস্টার সম্পাদনা';
          render();
          markDirty();
          toast('অসম্পূর্ণ মাসের রোস্টারে ফিরে এসেছেন।');
          return;
        }
      }

      // Preserve shifts by actual ISO date and employee row identity.
      // Names are editable and may not be unique, so they must not be used as keys.
      const oldShiftByDate = oldEmployees.map(emp => {
        const map = new Map();
        oldDays.forEach((d, i) => {
          const code = Array.isArray(emp.shifts) ? emp.shifts[i] : null;
          if (d?.isoDate && code) map.set(d.isoDate, code);
        });
        return map;
      });

      S.month = monthName;
      S.days = Array.from({length:daysInMonth}, (_,i) => {
        const day = i + 1;
        const isoDate = year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
        const date = new Date(Date.UTC(year, month - 1, day));
        return {
          date: toBangla(day),
          weekday: weekdays[date.getUTCDay()],
          isoDate
        };
      });

      oldEmployees.forEach((emp, ei) => {
        const byDate = oldShiftByDate[ei] || new Map();
        emp.shifts = S.days.map(d => byDate.get(d.isoDate) || 'OFF');
      });

      $('month').value = monthName;
      $('monthHead').textContent = monthName;
      render();
      
      markDirty();
      toast(oldDays.length === daysInMonth
        ? 'মাস ও সাল অনুযায়ী তারিখ আপডেট হয়েছে'
        : daysInMonth + ' দিনের রোস্টার তৈরি হয়েছে');
    }

    function setPicker() {
      const match = String(S.month || '').match(/(\d{4})/);
      if (!match) return;
      const year = Number(match[1]);
      const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
      const monthIndex = months.findIndex(x => String(S.month).includes(x));
      if (monthIndex >= 0) {
        $('monthPicker').value = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
      }
    }

    async function load() {
      const auth = await window.RosterAuthReady();
      if (!auth?.authenticated || auth.role !== 'admin') return;
      try {
        const r = await window.RosterAPI.request('/api/roster?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('roster load failed');
        S = await r.json();
        $('month').value = S.month || '';
        $('monthHead').textContent = S.month || 'রোস্টার সম্পাদনা';
        render();
        
        setPicker();
        cleanSnapshot=snapshot(); dirty=false; updateChangeUI();
      } catch {
        toast('নিরাপদ সার্ভার থেকে রোস্টার লোড হয়নি', true);
      }
      await refreshArchiveList(false);
    }

    function snapshot(){return JSON.stringify(S);}
    function diffChanges(){
      if(!cleanSnapshot)return [];
      let before;
      try{before=JSON.parse(cleanSnapshot)}catch{return []}
      const out=[];
      if(before.month!==S.month) out.push('রোস্টার: '+(before.month||'—')+' → '+(S.month||'—'));
      const beforeDays=Array.isArray(before.days)?before.days:[], currentDays=Array.isArray(S.days)?S.days:[];
      const maxDays=Math.max(beforeDays.length,currentDays.length);
      for(let i=0;i<maxDays;i++){
        const a=beforeDays[i], b=currentDays[i];
        if(!a&&b) out.push('নতুন তারিখ: '+(b.date||i+1));
        else if(a&&!b) out.push('তারিখ বাদ: '+(a.date||i+1));
        else if(a&&b){
          if(a.date!==b.date) out.push('তারিখ '+(b.date||i+1)+': '+(a.date||'—')+' → '+(b.date||'—'));
          if(a.weekday!==b.weekday) out.push('দিন '+(b.date||i+1)+': '+(a.weekday||'—')+' → '+(b.weekday||'—'));
          if(a.isoDate!==b.isoDate) out.push('ISO তারিখ '+(b.date||i+1)+': '+(a.isoDate||'—')+' → '+(b.isoDate||'—'));
        }
      }
      const beforeEmployees=Array.isArray(before.employees)?before.employees:[], currentEmployees=Array.isArray(S.employees)?S.employees:[];
      const maxEmp=Math.max(beforeEmployees.length,currentEmployees.length);
      for(let ei=0;ei<maxEmp;ei++){
        const e=currentEmployees[ei], old=beforeEmployees[ei];
        if(!old&&e){out.push('নতুন কর্মী: '+(e.name||'নামহীন'));continue}
        if(old&&!e){out.push('কর্মী বাদ: '+(old.name||'নামহীন'));continue}
        if(!e||!old) continue;
        if(e.name!==old.name) out.push('কর্মী: '+(old.name||'নামহীন')+' → '+(e.name||'নামহীন'));
        const shifts=Array.isArray(e.shifts)?e.shifts:[], oldShifts=Array.isArray(old.shifts)?old.shifts:[];
        const maxShift=Math.max(shifts.length,oldShifts.length,currentDays.length);
        for(let di=0;di<maxShift;di++){
          const code=shifts[di], oldCode=oldShifts[di];
          if(code!==oldCode) out.push((e.name||'কর্মী')+' • '+(currentDays[di]?.date||beforeDays[di]?.date||di+1)+' তারিখ: '+(oldCode||'—')+' → '+(code||'—'));
        }
      }
      const beforeTypes=before.shiftTypes||{}, currentTypes=S.shiftTypes||{};
      [...new Set([...Object.keys(beforeTypes),...Object.keys(currentTypes)])].forEach(code=>{
        const a=beforeTypes[code], b=currentTypes[code];
        if(!a&&b) out.push('শিফট ধরন যোগ: '+code);
        else if(a&&!b) out.push('শিফট ধরন বাদ: '+code);
        else if(JSON.stringify(a)!==JSON.stringify(b)) out.push('শিফট ধরন পরিবর্তন: '+code);
      });
      return out;
    }
    function markDirty(){dirty=snapshot()!==cleanSnapshot;updateChangeUI()}
    function updateChangeUI(){const el=$('changeStatus'),summary=$('changeSummary');if(!el||!summary)return;const changes=diffChanges();el.textContent=dirty?`● ${changes.length||1}টি পরিবর্তন করা হয়েছে`:'● কোনো পরিবর্তন নেই';el.className='change-status '+(dirty?'dirty':'clean');$('clearChanges').disabled=!dirty;if(!dirty){summary.hidden=true;summary.innerHTML='';return}summary.hidden=false;summary.innerHTML='<strong>Save করার আগে পরিবর্তনগুলো:</strong><ul>'+changes.slice(0,12).map(x=>'<li>'+esc(x)+'</li>').join('')+(changes.length>12?'<li>আরও '+(changes.length-12)+'টি পরিবর্তন…</li>':'')+'</ul>'}

    function render() {
      $('monthHead').textContent = S.month || 'রোস্টার সম্পাদনা';
      $('month').value = S.month || '';

      const weekdayNames = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
      const h = '<tr><th>কর্মী</th>' + S.days.map((d, i) => {
        const isoDate = /^\d{4}-\d{2}-\d{2}$/.test(d.isoDate || '') ? d.isoDate : '';
        const dateValue = d.date || (isoDate ? String(Number(isoDate.slice(8, 10))) : '');
        const parsedDate = isoDate ? new Date(isoDate + 'T00:00:00.000Z') : null;
        const weekdayValue = d.weekday || (parsedDate && !Number.isNaN(parsedDate.getTime()) ? weekdayNames[parsedDate.getUTCDay()] : '');
        return `
        <th class="editor-day-heading">
          <input class="editor-day-date" type="text" inputmode="numeric" value="${esc(dateValue)}" data-day="${i}" aria-label="তারিখ">
          <input class="editor-day-weekday" type="text" value="${esc(weekdayValue)}" data-wd="${i}" readonly aria-label="বার" title="তারিখ অনুযায়ী স্বয়ংক্রিয়">
          <button class="remove" data-rmday="${i}">বাদ</button>
        </th>
      `;}).join('') + '</tr>';

      const b = S.employees.map((e, ei) => `
        <tr>
          <th>
            <input value="${esc(e.name)}" data-name="${ei}" maxlength="80" aria-label="কর্মীর নাম: ${esc(e.name)}">
            <button class="remove" data-rmemp="${ei}">বাদ</button>
          </th>
          ${e.shifts.map((c, di) => `<td><button class="edit shift-${String(c).toLowerCase()}" data-ei="${ei}" data-di="${di}">${esc(c)}</button></td>`).join('')}
        </tr>
      `).join('');

      $('editor').innerHTML = '<thead>' + h + '</thead><tbody>' + b + '</tbody>';
      const bulkDate = $('bulkDate');
      const previousDate = bulkDate.value;
      bulkDate.innerHTML = S.days.map((d,i) => '<option value="'+i+'">'+esc(d.date)+' · '+esc(d.weekday)+'</option>').join('');
      if (S.days.length) bulkDate.value = S.days.some((d,i)=>String(i)===previousDate) ? previousDate : '0';
      const bulkShift = $('bulkShift');
      const previousShift = bulkShift.value;
      bulkShift.innerHTML = '<option value="">Shift নির্বাচন</option>'+Object.entries(S.shiftTypes||{}).map(([code,v])=>'<option value="'+esc(code)+'">'+esc(code)+' — '+esc(v.label)+'</option>').join('');
      if (Object.prototype.hasOwnProperty.call(S.shiftTypes||{},previousShift)) bulkShift.value=previousShift;
      applyRosterFilters();

      $('editor').querySelectorAll('[data-day]').forEach(x => x.onchange = e => {
        const index = +e.target.dataset.day;
        const day = S.days[index];
        const entered = String(e.target.value || '').trim();
        const digits = entered.replace(/[০-৯]/g, digit => '0123456789'['০১২৩৪৫৬৭৮৯'.indexOf(digit)]);
        if (!digits || digits.length > 2 || [...digits].some(char => char < '0' || char > '9')) {
          toast('তারিখ ১ থেকে ৩১-এর মধ্যে লিখুন।', true);
          render();
          return;
        }
        const dayNumber = Number(digits);
        if (dayNumber < 1 || dayNumber > 31) {
          toast('তারিখ ১ থেকে ৩১-এর মধ্যে লিখুন।', true);
          render();
          return;
        }
        const selectedMonth = $('monthPicker').value;
        const baseIso = day?.isoDate || (selectedMonth ? selectedMonth + '-01' : '');
        if (baseIso.length !== 10) {
          toast('তারিখ পরিবর্তনের আগে মাস ও সাল নির্বাচন করুন।', true);
          render();
          return;
        }
        const yearMonth = baseIso.slice(0, 7);
        const isoDate = yearMonth + '-' + String(dayNumber).padStart(2, '0');
        const dateObject = new Date(isoDate + 'T00:00:00.000Z');
        if (!Number.isFinite(dateObject.getTime()) || dateObject.toISOString().slice(0, 10) !== isoDate) {
          toast('এই মাসে এমন কোনো তারিখ নেই।', true);
          render();
          return;
        }
        if (S.days.some((item, itemIndex) => itemIndex !== index && item.isoDate === isoDate)) {
          toast('এই তারিখটি রোস্টারে আগে থেকেই আছে।', true);
          render();
          return;
        }
        if ((index > 0 && isoDate <= S.days[index - 1].isoDate) ||
            (index < S.days.length - 1 && isoDate >= S.days[index + 1].isoDate)) {

    function stableStringify(value) {
      if (Array.isArray(value)) return '[' + value.map(stableStringify).join(',') + ']';
      if (value && typeof value === 'object') {
        return '{' + Object.keys(value).sort().map(key => JSON.stringify(key) + ':' + stableStringify(value[key])).join(',') + '}';
      }
      return JSON.stringify(value);
    }

    async function archiveIfNeeded() {
      for (const [month, data] of [...archivePending.entries()]) {
        const archiveUrl = '/api/archive?month=' + encodeURIComponent(month);
        const existingResponse = await window.RosterAPI.request(archiveUrl, { cache: 'no-store' });
        if (existingResponse.ok) {
          const existing = await existingResponse.json().catch(() => null);
          if (stableStringify(existing) !== stableStringify(data)) {
            throw new Error('ARCHIVE_EXISTS');
          }
          archivePending.delete(month);
          continue;
        }
        if (existingResponse.status !== 404) {
          throw new Error('ARCHIVE_CHECK_FAILED');
        }

        const r = await window.RosterAPI.request('/api/admin/archive', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ month, data })
        });
        const result = await r.json().catch(() => ({}));
        if (!r.ok) {
          // Another admin tab may have archived the same month after our check.
          if (r.status === 409 || result.error === 'ARCHIVE_EXISTS') {
            const verify = await window.RosterAPI.request(archiveUrl, { cache: 'no-store' });
            const saved = verify.ok ? await verify.json().catch(() => null) : null;
            if (stableStringify(saved) !== stableStringify(data)) {
              throw new Error('ARCHIVE_EXISTS');
            }
          } else {
            throw new Error(result.error || 'archive save failed');
          }
        }
        archivePending.delete(month);
      }
    }

    let currentArchive = null;

    function validArchiveData(month, data) {
      if (!data || typeof data !== 'object' || !Array.isArray(data.days) ||
          !Array.isArray(data.employees) || !data.days.length || data.days.length > 31 ||
          data.employees.length > 100) return false;
      if (data.days[0]?.isoDate?.slice(0, 7) !== month) return false;
      if (!data.days.every(day => day && day.isoDate?.slice(0, 7) === month)) return false;
      return data.employees.every(emp => emp && Array.isArray(emp.shifts) &&
        emp.shifts.length === data.days.length &&
        emp.shifts.every(code => ['A', 'B', 'C', 'OFF', 'L'].includes(code)));
    }

        const counts = {};

          for (const code of employee.shifts) counts[code] = (counts[code] || 0) + 1;

          const parsedDate = /^\d{4}-\d{2}-\d{2}$/.test(day.isoDate || '')

      } catch (error) {
        if (requestId !== archiveRequestId) return;
        preview.textContent = error.message || 'Archive লোড করা যায়নি।';
      }
    }

    async function refreshArchiveList(preserveSelection = true) {
      const select = $('archiveMonth');
      const button = $('refreshArchives');
      const previous = preserveSelection ? select.value : '';
      button.disabled = true;
      button.textContent = 'লোড হচ্ছে…';
      try {
        const response = await window.RosterAPI.request('/api/archives?refresh=' + Date.now(), { cache: 'no-store' });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload || !Array.isArray(payload.months)) throw new Error('Archive তালিকা আনা যায়নি।');
        const months = [...new Set(payload.months.filter(month => /^\d{4}-(0[1-9]|1[0-2])$/.test(month)))].sort((a, b) => b.localeCompare(a));
        select.replaceChildren();
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = months.length ? 'মাস নির্বাচন করুন' : 'কোনো Archive নেই';
        select.appendChild(placeholder);
        for (const month of months) {
          const [year, monthNumber] = month.split('-').map(Number);
          const label = new Intl.DateTimeFormat('bn-BD', { month: 'long', year: 'numeric' })
            .format(new Date(Date.UTC(year, monthNumber - 1, 1)));
          const option = document.createElement('option');
          option.value = month;
          option.textContent = label + ' · ' + month;
          select.appendChild(option);
        }
        const selected = months.includes(previous) ? previous : (months[0] || '');
        select.value = selected;
        if (selected) await loadArchive(selected);
        else {
          archiveRequestId++;
          currentArchive = null;
          $('downloadArchive').disabled = true;
          $('archivePreview').textContent = 'এখনো কোনো মাসের Archive সংরক্ষিত নেই।';
        }
      } catch (error) {
        archiveRequestId++;
        currentArchive = null;
        $('downloadArchive').disabled = true;
        $('archivePreview').textContent = error.message || 'Archive তালিকা আনা যায়নি।';
        select.replaceChildren();
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'তালিকা পাওয়া যায়নি';
        select.appendChild(option);
      } finally {
        button.disabled = false;
        button.textContent = 'তালিকা রিফ্রেশ';
      }
    }

    $('archiveMonth').addEventListener('change', () => loadArchive($('archiveMonth').value));
    $('refreshArchives').addEventListener('click', () => refreshArchiveList(true));
    $('downloadArchive').addEventListener('click', () => {
      if (!currentArchive) return;
      const blob = new Blob([JSON.stringify(currentArchive.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'archive-' + currentArchive.month + '.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    applyTheme();
    load();
  </script>
<script>
/* One-time recovery helper: import the existing public September archive into private KV. */
(async function(){
  const shell=document.querySelector('.page-shell');
  if(!shell || !window.RosterAPI) return;
  const auth = await window.RosterAuthReady();
  if (!auth?.authenticated || auth.role !== 'admin') return;
  try {
    const check=await window.RosterAPI.request('/api/archive?month=2026-09',{cache:'no-store'});
    if(check.ok || check.status!==404) return;
    const box=document.createElement('section');
    box.className='panel';
    box.style.marginBottom='16px';
    box.innerHTML='<div class="section-head"><div><span class="eyebrow">ONE-TIME RECOVERY</span><h2>সেপ্টেম্বর ২০২৬ আর্কাইভ সংরক্ষণ</h2></div></div><p style="color:var(--muted);font-size:13px;line-height:1.6">বর্তমান প্রকাশ্য archive ফাইল থেকে সেপ্টেম্বরের রোস্টার নিরাপদ KV-তে কপি করবে। বর্তমান অক্টোবর রোস্টার বদলাবে না। কাজ সফল হওয়ার পর প্রকাশ্য archive ফাইল সরানো যাবে।</p><button id="importSeptemberArchive" class="primary" type="button">সেপ্টেম্বরের ডেটা নিরাপদে সংরক্ষণ</button><p id="archiveImportStatus" role="status" style="margin-top:8px;font-size:12px"></p>';
    shell.insertBefore(box,shell.firstChild);
    const button=box.querySelector('#importSeptemberArchive');
    const status=box.querySelector('#archiveImportStatus');
    button.addEventListener('click',async()=>{
      button.disabled=true; status.textContent='ডেটা কপি হচ্ছে…';
      try {
        const source=await fetch('archive/2026-09.json?recovery='+Date.now(),{cache:'no-store'});
        if(!source.ok) throw new Error('সেপ্টেম্বরের পুরোনো ফাইল পাওয়া যায়নি');
        const data=await source.json();
        const saved=await window.RosterAPI.request('/api/admin/archive',{
          method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',
          body:JSON.stringify({month:'2026-09',data})
        });
        const result=await saved.json().catch(()=>({}));
        if(!saved.ok) throw new Error(result.error==='ARCHIVE_EXISTS'?'সেপ্টেম্বরের আর্কাইভ আগে থেকেই সংরক্ষিত আছে':(result.error||'সংরক্ষণ করা যায়নি'));
        status.textContent='সেপ্টেম্বরের রোস্টার নিরাপদে সংরক্ষিত হয়েছে। এখন সাইটে গিয়ে সেপ্টেম্বর মাস খুলে যাচাই করো।';
        button.textContent='সংরক্ষণ সম্পন্ন'; 
      } catch(error) {
        status.textContent=error.message||'সংরক্ষণ করা যায়নি।';
        button.disabled=false;
      }
    });
  } catch {}
})();
</script>
