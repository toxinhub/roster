</style></head>
<body data-required-role="admin">
  <div class="app admin-app">
    <header class="topbar">
      <div class="brand"><strong>রোস্টার • CCTV - PJL</strong><small>Duty roster editor</small></div>
      <div class="top-actions">
        <div class="seg"><button id="vw" class="on" type="button">সপ্তাহ</button><button id="vm" type="button">মাস</button></div>
      </div>
    </header>
    <main class="page-shell">
      <section id="roster-editor">
        <div class="roster-nav">
          <div class="nav"><button id="pv" type="button" aria-label="আগের সপ্তাহ">‹</button><span id="wk"></span><button id="nx" type="button" aria-label="পরের সপ্তাহ">›</button></div>
          <button id="addDay" type="button">＋ তারিখ যোগ</button>
        </div>
        <div class="tools" id="brushTools"></div>
        <div class="tw"><table class="g" id="editor"></table></div>
        <div class="leg"><span>কভারেজ: ভরাট বিন্দু = শিফটে কেউ আছে</span><span class="r">লাল ফাঁকা বিন্দু = খালি</span><span class="r">লাল দাগ = রাতের (C) পরদিন সকাল (A)</span></div>
        <div class="form-grid"><label>রোস্টারের শিরোনাম<input id="month" maxlength="80"></label><label>মাস ও সাল<input id="monthPicker" type="month"></label></div>
        <div class="legacy-admin-controls" aria-hidden="true">
          <button id="theme" type="button">থিম</button><input id="employeeSearch" type="search"><select id="shiftFilter"><option value="ALL">সব Shift</option></select>
          <select id="bulkDate"></select><select id="bulkShift"></select><button id="bulkApply" type="button">Apply</button><p id="rosterResultCount"></p>
          <button id="download" type="button">Download</button><select id="archiveMonth"><option value="">Archive</option></select>
          <button id="refreshArchives" type="button">Refresh</button><button id="downloadArchive" type="button" disabled>Download archive</button><div id="archivePreview"></div>
        </div>
        <div class="editor-meta"><span id="changeStatus" class="change-status clean">● কোনো পরিবর্তন নেই</span><button id="clearChanges" class="quiet" type="button" disabled>বাতিল</button></div>
        <div id="changeSummary" hidden></div><div id="tools"><button id="save" type="button">Save</button></div>
      </section>
    </main>
  </div>
  <div class="bar" id="bar"><span id="bt">০টি পরিবর্তন</span><button id="un" type="button">Undo</button><button id="rv" type="button">বাতিল</button><button class="s" id="sv" type="button">Save</button></div>
  <div hidden><span id="monthHead"></span><span id="status"></span></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    let S = null;
    let sha = null;
    let cleanSnapshot = '';
    let dirty = false;
    const archivePending = new Map();
    const $ = id => document.getElementById(id);
    const key = 'cctv_roster_admin';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    function toast(message, error = false) {
      const t = $('toast');
      t.textContent = message;
      t.className = 'toast show' + (error ? ' err' : '');
      setTimeout(() => t.className = 'toast', 3500);
    }

    function applyTheme() {
      const inkMode = localStorage.getItem('roster-display-mode') === 'ink';
      document.body.classList.toggle('ink-mode', inkMode);
      $('theme').textContent = inkMode ? '☀' : '☀';
      $('theme').setAttribute('aria-label', inkMode ? 'লাইট মোড' : 'ইঙ্ক মোড');
      $('theme').setAttribute('title', inkMode ? 'Light Mode' : 'Ink Mode');
      $('theme').setAttribute('aria-label', inkMode ? 'লাইট মোড' : 'ইঙ্ক মোড');
      $('theme').setAttribute('title', inkMode ? 'Light Mode' : 'Ink Mode');
    }

    function syncMonth() {
      const value = $('monthPicker').value;
      if (!value || !S) return;
      const [year, month] = value.split('-').map(Number);
      const monthName = new Intl.DateTimeFormat('bn-BD', { month: 'long', year: 'numeric' }).format(new Date(Date.UTC(year, month - 1, 1)));
      const weekdays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
      const toBangla = n => String(n).replace(/0/g,'০').replace(/1/g,'১').replace(/2/g,'২').replace(/3/g,'৩').replace(/4/g,'৪').replace(/5/g,'৫').replace(/6/g,'৬').replace(/7/g,'৭').replace(/8/g,'৮').replace(/9/g,'৯');
      const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
      const oldDays = Array.isArray(S.days) ? S.days : [];
      const oldEmployees = Array.isArray(S.employees) ? S.employees : [];

      // Keep the latest unsaved snapshot whenever leaving a month.
      // Returning to a pending month restores its actual edits instead of
      // generating a blank roster or trapping the editor on the new month.
      const oldKey = oldDays[0]?.isoDate?.slice(0,7) || '';
      const newKey = value;
      if (oldKey && newKey && oldKey !== newKey) {
        archivePending.set(oldKey, JSON.parse(JSON.stringify(S)));
        if (archivePending.has(newKey)) {
          S = JSON.parse(JSON.stringify(archivePending.get(newKey)));
          archivePending.delete(newKey);
          $('month').value = S.month || '';
          $('monthHead').textContent = S.month || 'রোস্টার সম্পাদনা';
          render();
          markDirty();
          toast('অসম্পূর্ণ মাসের রোস্টারে ফিরে এসেছেন।');
          return;
        }
      }

      // Preserve shifts by actual ISO date and employee row identity.
      // Names are editable and may not be unique, so they must not be used as keys.
      const oldShiftByDate = oldEmployees.map(emp => {
        const map = new Map();
        oldDays.forEach((d, i) => {
          const code = Array.isArray(emp.shifts) ? emp.shifts[i] : null;
          if (d?.isoDate && code) map.set(d.isoDate, code);
        });
        return map;
      });

      S.month = monthName;
      S.days = Array.from({length:daysInMonth}, (_,i) => {
        const day = i + 1;
        const isoDate = year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
        const date = new Date(Date.UTC(year, month - 1, day));
        return {
          date: toBangla(day),
          weekday: weekdays[date.getUTCDay()],
          isoDate
        };
      });

      oldEmployees.forEach((emp, ei) => {
        const byDate = oldShiftByDate[ei] || new Map();
        emp.shifts = S.days.map(d => byDate.get(d.isoDate) || 'OFF');
      });

      $('month').value = monthName;
      $('monthHead').textContent = monthName;
      render();
      
      markDirty();
      toast(oldDays.length === daysInMonth
        ? 'মাস ও সাল অনুযায়ী তারিখ আপডেট হয়েছে'
        : daysInMonth + ' দিনের রোস্টার তৈরি হয়েছে');
    }

    function setPicker() {
      const match = String(S.month || '').match(/(\d{4})/);
      if (!match) return;
      const year = Number(match[1]);
      const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
      const monthIndex = months.findIndex(x => String(S.month).includes(x));
      if (monthIndex >= 0) {
        $('monthPicker').value = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
      }
    }

    async function load() {
      const auth = await window.RosterAuthReady();
      if (!auth?.authenticated || auth.role !== 'admin') return;
      try {
        const r = await window.RosterAPI.request('/api/roster?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('roster load failed');
        S = await r.json();
        $('month').value = S.month || '';
        $('monthHead').textContent = S.month || 'রোস্টার সম্পাদনা';
        render();
        
        setPicker();
        cleanSnapshot=snapshot(); dirty=false; updateChangeUI();
      } catch {
        toast('নিরাপদ সার্ভার থেকে রোস্টার লোড হয়নি', true);
      }
      await refreshArchiveList(false);
    }

    function snapshot(){return JSON.stringify(S);}
    function diffChanges(){
      if(!cleanSnapshot)return [];
      let before;
      try{before=JSON.parse(cleanSnapshot)}catch{return []}
      const out=[];
      if(before.month!==S.month) out.push('রোস্টার: '+(before.month||'—')+' → '+(S.month||'—'));
      const beforeDays=Array.isArray(before.days)?before.days:[], currentDays=Array.isArray(S.days)?S.days:[];
      const maxDays=Math.max(beforeDays.length,currentDays.length);
      for(let i=0;i<maxDays;i++){
        const a=beforeDays[i], b=currentDays[i];
        if(!a&&b) out.push('নতুন তারিখ: '+(b.date||i+1));
        else if(a&&!b) out.push('তারিখ বাদ: '+(a.date||i+1));
        else if(a&&b){
          if(a.date!==b.date) out.push('তারিখ '+(b.date||i+1)+': '+(a.date||'—')+' → '+(b.date||'—'));
          if(a.weekday!==b.weekday) out.push('দিন '+(b.date||i+1)+': '+(a.weekday||'—')+' → '+(b.weekday||'—'));
          if(a.isoDate!==b.isoDate) out.push('ISO তারিখ '+(b.date||i+1)+': '+(a.isoDate||'—')+' → '+(b.isoDate||'—'));
        }
      }
      const beforeEmployees=Array.isArray(before.employees)?before.employees:[], currentEmployees=Array.isArray(S.employees)?S.employees:[];
      const maxEmp=Math.max(beforeEmployees.length,currentEmployees.length);
      for(let ei=0;ei<maxEmp;ei++){
        const e=currentEmployees[ei], old=beforeEmployees[ei];
        if(!old&&e){out.push('নতুন কর্মী: '+(e.name||'নামহীন'));continue}
        if(old&&!e){out.push('কর্মী বাদ: '+(old.name||'নামহীন'));continue}
        if(!e||!old) continue;
        if(e.name!==old.name) out.push('কর্মী: '+(old.name||'নামহীন')+' → '+(e.name||'নামহীন'));
        const shifts=Array.isArray(e.shifts)?e.shifts:[], oldShifts=Array.isArray(old.shifts)?old.shifts:[];
        const maxShift=Math.max(shifts.length,oldShifts.length,currentDays.length);
        for(let di=0;di<maxShift;di++){
          const code=shifts[di], oldCode=oldShifts[di];
          if(code!==oldCode) out.push((e.name||'কর্মী')+' • '+(currentDays[di]?.date||beforeDays[di]?.date||di+1)+' তারিখ: '+(oldCode||'—')+' → '+(code||'—'));
        }
      }
      const beforeTypes=before.shiftTypes||{}, currentTypes=S.shiftTypes||{};
      [...new Set([...Object.keys(beforeTypes),...Object.keys(currentTypes)])].forEach(code=>{
        const a=beforeTypes[code], b=currentTypes[code];
        if(!a&&b) out.push('শিফট ধরন যোগ: '+code);
        else if(a&&!b) out.push('শিফট ধরন বাদ: '+code);
        else if(JSON.stringify(a)!==JSON.stringify(b)) out.push('শিফট ধরন পরিবর্তন: '+code);
      });
      return out;
    }
    function markDirty(){dirty=snapshot()!==cleanSnapshot;updateChangeUI()}
    function updateChangeUI(){const el=$('changeStatus'),summary=$('changeSummary');if(!el||!summary)return;const changes=diffChanges();el.textContent=dirty?`${changes.length||1}টি পরিবর্তন`:'কোনো পরিবর্তন নেই';el.className='change-status '+(dirty?'dirty':'clean');$('clearChanges').disabled=!dirty;summary.hidden=true;summary.innerHTML='';$('bar').style.display=dirty?'flex':'none';$('bt').textContent=toBn(changes.length||1)+'টি পরিবর্তন';$('un').disabled=!paintHistory.length}

    let view='w', weekIndex=0, brush='A', painting=false, paintHistory=[];
    const shiftOrder=['A','B','C','OFF','L'];
    const toBn=n=>String(n).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[Number(d)]);
    function renderBrushTools(){
      const labels={A:'A',B:'B',C:'C',OFF:'OFF',L:'Leave'};
      $('brushTools').innerHTML=shiftOrder.filter(code=>S.shiftTypes?.[code]).map(code=>{
        const timing=S.shiftTypes[code]?.label||'';
        return '<button type="button" class="b'+(brush===code?' on':'')+'" data-brush="'+code+'">'+labels[code]+(timing?'<small>'+esc(timing)+'</small>':'')+'</button>';
      }).join('');
    }
    function render() {
      if(!S)return;
      $('monthHead').textContent=S.month||'রোস্টার';
      $('month').value=S.month||'';
      const total=S.days.length;
      const start=view==='w'?Math.min(weekIndex*7,Math.max(0,total-1)):0;
      const end=view==='w'?Math.min(start+7,total):total;
      const now=new Date();const today=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
      const first=S.days[start]?.isoDate||'';
      const last=S.days[end-1]?.isoDate||'';
      const formatDate=iso=>{if(!iso)return '';const p=iso.split('-');return toBn(Number(p[2]))};
      $('wk').textContent=view==='w'
        ? (formatDate(first)+' – '+formatDate(last)+' '+(S.month||''))
        : (S.month||'');
      $('pv').style.visibility=view==='w'?'visible':'hidden';
      $('nx').style.visibility=view==='w'?'visible':'hidden';
      $('pv').disabled=weekIndex<=0;
      $('nx').disabled=end>=total;
      $('vw').className=view==='w'?'on':'';
      $('vm').className=view==='m'?'on':'';
      const weekdays=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
      let html='<thead><tr><th class="nm"></th>';
      for(let d=start;d<end;d++){
        const day=S.days[d],iso=day.isoDate||'',parsed=/^\\d{4}-\\d{2}-\\d{2}$/.test(iso)?new Date(iso+'T00:00:00Z'):null;
        const wd=parsed&&!Number.isNaN(parsed.getTime())?weekdays[parsed.getUTCDay()]:String(day.weekday||'').slice(0,3);
        const current=iso===today;
        html+='<th class="'+(wd==='শুক্র'?'f ':'')+(current?'td':'')+'"><b>'+esc(day.date||formatDate(iso))+'</b>'+esc(wd)+(current?'<small>আজ</small>':'')+'</th>';
      }
      html+='</tr></thead><tbody>';
      S.employees.forEach((employee,ei)=>{
        html+='<tr><th class="nm">'+esc(employee.name)+'</th>';
        for(let d=start;d<end;d++){
          const code=employee.shifts[d]||'OFF';
          const previous=d>0?employee.shifts[d-1]:'';
          const invalid=code==='A'&&previous==='C';
          html+='<td class="c '+(code==='OFF'?'O':code==='L'?'L':code)+' '+(invalid?'x ':'')+(S.days[d].isoDate===today?'td':'')+'" data-ei="'+ei+'" data-di="'+d+'">'+(code==='OFF'?'OFF':code==='L'?'L':esc(code))+'</td>';
        }
        html+='</tr>';
      });
      html+='<tr><th class="nm cl">কভারেজ</th>';
      for(let d=start;d<end;d++){
        html+='<td class="cv '+(S.days[d].isoDate===today?'td':'')+'">'+['A','B','C'].map(code=>'<i class="'+code+(S.employees.some(emp=>emp.shifts[d]===code)?' ok':'')+'"></i>').join('')+'</td>';
      }
      html+='</tr></tbody>';
      $('editor').innerHTML=html;
      renderBrushTools();
      updateChangeUI();
    }
    function applyPaint(cell){
      if(!cell||!cell.dataset||cell.dataset.ei===undefined)return false;
      const ei=Number(cell.dataset.ei),di=Number(cell.dataset.di),emp=S.employees[ei];
      if(!emp||!Number.isInteger(di)||di<0||di>=S.days.length)return false;
      if(emp.shifts[di]===brush)return false;
      emp.shifts[di]=brush;
      cell.textContent=brush==='OFF'?'OFF':brush==='L'?'L':brush;
      cell.className='c '+(brush==='OFF'?'O':brush==='L'?'L':brush)+(S.days[di].isoDate===localTodayISO()?' td':'');
      const row=cell.parentElement;
      if(row){
        row.querySelectorAll('.c').forEach(node=>{
          const index=Number(node.dataset.di);
          const value=emp.shifts[index];
          const invalid=value==='A'&&index>0&&emp.shifts[index-1]==='C';
          node.classList.toggle('x',invalid);
        });
      }
      dirty=true;
      $('bar').style.display='flex';
      $('bt').textContent='পরিবর্তন হয়েছে';
      $('un').disabled=false;
      $('changeStatus').textContent='পরিবর্তন হয়েছে';
      $('changeStatus').className='change-status dirty';
      $('clearChanges').disabled=false;
      return true;
    }
    function localTodayISO(){
      const now=new Date();
      return now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    }
    $('brushTools').onclick=e=>{const button=e.target.closest('[data-brush]');if(!button)return;brush=button.dataset.brush;renderBrushTools();};
    $('editor').addEventListener('pointerdown',e=>{
      const cell=e.target.closest('.c');if(!cell)return;
      e.preventDefault();painting=true;try{$('editor').setPointerCapture(e.pointerId)}catch{}paintHistory.push(snapshot());applyPaint(cell);
    });
    $('editor').addEventListener('pointermove',e=>{
      if(!painting)return;
      const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.c');
      if(cell)applyPaint(cell);
    });
    const finishPainting=()=>{if(!painting)return;painting=false;render()};window.addEventListener('pointerup',finishPainting);window.addEventListener('pointercancel',finishPainting);
    $('vw').onclick=()=>{view='w';weekIndex=0;render()};
    $('vm').onclick=()=>{view='m';render()};
    $('pv').onclick=()=>{weekIndex=Math.max(0,weekIndex-1);render()};
    $('nx').onclick=()=>{weekIndex=Math.min(Math.ceil(S.days.length/7)-1,weekIndex+1);render()};
    $('un').onclick=()=>{if(!paintHistory.length)return;S=JSON.parse(paintHistory.pop());markDirty();render()};
    $('rv').onclick=()=>$('clearChanges').click();
    $('sv').onclick=()=>$('save').click();

    function applyRosterFilters(){
      if(!S)return;
      const query=String($('employeeSearch')?.value||'').trim().toLocaleLowerCase();
      const shift=$('shiftFilter')?.value||'ALL';
      let shown=0;
      $('editor').querySelectorAll('tbody tr').forEach((row,ei)=>{
        const emp=S.employees[ei];
        const name=String(emp?.name||'').toLocaleLowerCase();
        const matchesName=!query||name.includes(query);
        const matchesShift=shift==='ALL'||(emp?.shifts||[]).includes(shift);
        row.hidden=!(matchesName&&matchesShift);
        if(!row.hidden)shown++;
      });
      $('rosterResultCount').textContent=shown+' / '+(S.employees||[]).length+' জন কর্মী দেখানো হচ্ছে';
    }
    $('employeeSearch').addEventListener('input',applyRosterFilters);
    $('shiftFilter').addEventListener('change',applyRosterFilters);
    $('bulkApply').addEventListener('click',()=>{
      const dayIndex=Number($('bulkDate').value);
      if(!Number.isInteger(dayIndex)||!S.days[dayIndex]){toast('আগে একটি তারিখ নির্বাচন করুন।',true);return;}
      const normalized=$('bulkShift').value;
      if(!Object.prototype.hasOwnProperty.call(S.shiftTypes||{},normalized)){toast('নতুন Shift নির্বাচন করুন।',true);return;}
      if(!confirm(S.days[dayIndex].date+' তারিখে '+S.employees.length+' জন কর্মীর Shift '+normalized+' করবেন?'))return;
      S.employees.forEach(emp=>{emp.shifts[dayIndex]=normalized;});
      markDirty();render();toast('Bulk shift update হয়েছে। Save করতে ভুলবেন না।');
    });

    function closePicker(){ document.querySelector('.picker')?.remove(); document.removeEventListener('pointerdown',outsidePicker); }
    function outsidePicker(e){ const p=document.querySelector('.picker'); if(p && !p.contains(e.target) && !e.target.closest('.edit')) closePicker(); }
    function pick(btn){
      closePicker(); const p=document.createElement('div'); p.className='picker';
      const ei=+btn.dataset.ei, di=+btn.dataset.di, current=S.employees[ei].shifts[di];
      Object.entries(S.shiftTypes).forEach(([code,v])=>{ const b=document.createElement('button'); b.type='button'; b.className='shift-option shift-'+code.toLowerCase()+(code===current?' selected':''); b.innerHTML='<strong>'+esc(code)+'</strong><small>'+esc(v.label)+'</small>'; b.onclick=()=>{ if(S.employees[ei].shifts[di]!==code){S.employees[ei].shifts[di]=code;markDirty();} closePicker();render(); }; p.appendChild(b); });
      document.body.appendChild(p); const r=btn.getBoundingClientRect();
      if(innerWidth<=600){p.style.left='10px';p.style.right='10px';p.style.bottom='12px';} else {p.style.left=Math.max(10,Math.min(r.left,innerWidth-292))+'px';p.style.top=Math.min(r.bottom+6,innerHeight-120)+'px';}
      requestAnimationFrame(()=>document.addEventListener('pointerdown',outsidePicker));
    }

    $('month').onchange=e=>{S.month=e.target.value;$('monthHead').textContent=S.month;markDirty()};
    $('clearChanges').onclick=()=>{if(!dirty)return;if(!confirm('সব অসম্পূর্ণ পরিবর্তন বাতিল করবেন?'))return;S=JSON.parse(cleanSnapshot);archivePending.clear();paintHistory=[];render();markDirty();toast('পরিবর্তন বাতিল হয়েছে')};
    let monthSwitchRequestId = 0;
    $('monthPicker').onchange = async () => {
      const requestId = ++monthSwitchRequestId;
      const selectedMonth = $('monthPicker').value;
      const currentMonth = S?.days?.[0]?.isoDate?.slice(0, 7) || '';
      if (selectedMonth && selectedMonth !== currentMonth) {
        try {
          const response = await window.RosterAPI.request('/api/archive?month=' + encodeURIComponent(selectedMonth), { cache: 'no-store' });
          if (requestId !== monthSwitchRequestId) return;
          if (response.ok) {
            $('monthPicker').value = currentMonth;
            toast('এই মাসটি Archive-এ সংরক্ষিত। পুরোনো মাসটি Read-only।', true);
            return;
          }
          if (response.status !== 404) throw new Error('ARCHIVE_CHECK_FAILED');
        } catch {
          if (requestId !== monthSwitchRequestId) return;
          $('monthPicker').value = currentMonth;
          toast('মাস পরিবর্তনের আগে Archive যাচাই করা যায়নি।', true);
          return;
        }
      }
      if (requestId !== monthSwitchRequestId) return;
      syncMonth();
    };

    $('addDay').onclick = () => {
      if (S.days.length >= 31) {
        toast('একটি মাসের রোস্টারে সর্বোচ্চ ৩১টি তারিখ রাখা যাবে।', true);
        return;
      }
      const lastIso = [...S.days].reverse().find(d => {
        const value = d?.isoDate || '';
        return value.length === 10 && value[4] === '-' && value[7] === '-' &&
          [...value].every((char, index) => index === 4 || index === 7 || (char >= '0' && char <= '9'));
      })?.isoDate;
      let nextDate;
      if (lastIso) {
        const [y, m, d] = lastIso.split('-').map(Number);
        nextDate = new Date(Date.UTC(y, m - 1, d + 1));
      } else if ($('monthPicker').value) {
        const [y, m] = $('monthPicker').value.split('-').map(Number);
        nextDate = new Date(Date.UTC(y, m - 1, S.days.length + 1));
      } else {
        toast('নতুন তারিখ তৈরির আগে মাস ও সাল নির্বাচন করুন।', true);
        return;
      }
      if (!Number.isFinite(nextDate.getTime())) {
        toast('নতুন তারিখ তৈরি করা যায়নি। মাস ও সাল যাচাই করুন।', true);
        return;
      }
      const isoDate = nextDate.toISOString().slice(0, 10);
      const rosterMonth = S.days[0]?.isoDate?.slice(0, 7) || $('monthPicker').value;
      if (!rosterMonth || isoDate.slice(0, 7) !== rosterMonth) {
        toast('নির্বাচিত মাসের বাইরে নতুন তারিখ যোগ করা যাবে না।', true);
        return;
      }
      const toBangla = n => String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[Number(d)]);
      const weekdays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
      S.days.push({
        date: toBangla(nextDate.getUTCDate()),
        weekday: weekdays[nextDate.getUTCDay()],
        isoDate
      });
      S.employees.forEach(emp => emp.shifts.push('OFF'));
      markDirty(); render(); 
    };

    $('download').onclick = () => {
      S.month = $('month').value;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
      a.download = 'schedule.json';
      a.click();
    };

    function stableStringify(value) {
      if (Array.isArray(value)) return '[' + value.map(stableStringify).join(',') + ']';
      if (value && typeof value === 'object') {
        return '{' + Object.keys(value).sort().map(key => JSON.stringify(key) + ':' + stableStringify(value[key])).join(',') + '}';
      }
      return JSON.stringify(value);
    }

    async function archiveIfNeeded() {
      for (const [month, data] of [...archivePending.entries()]) {
        const archiveUrl = '/api/archive?month=' + encodeURIComponent(month);
        const existingResponse = await window.RosterAPI.request(archiveUrl, { cache: 'no-store' });
        if (existingResponse.ok) {
          const existing = await existingResponse.json().catch(() => null);
          if (stableStringify(existing) !== stableStringify(data)) {
            throw new Error('ARCHIVE_EXISTS');
          }
          archivePending.delete(month);
          continue;
        }
        if (existingResponse.status !== 404) {
          throw new Error('ARCHIVE_CHECK_FAILED');
        }

        const r = await window.RosterAPI.request('/api/admin/archive', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ month, data })
        });
        const result = await r.json().catch(() => ({}));
        if (!r.ok) {
          // Another admin tab may have archived the same month after our check.
          if (r.status === 409 || result.error === 'ARCHIVE_EXISTS') {
            const verify = await window.RosterAPI.request(archiveUrl, { cache: 'no-store' });
            const saved = verify.ok ? await verify.json().catch(() => null) : null;
            if (stableStringify(saved) !== stableStringify(data)) {
              throw new Error('ARCHIVE_EXISTS');
            }
          } else {
            throw new Error(result.error || 'archive save failed');
          }
        }
        archivePending.delete(month);
      }
    }

    $('save').onclick = async () => {
      S.month = $('month').value;
      const names = S.employees.map(emp => String(emp.name || '').trim());
      const normalizedNames = names.map(name => name.toLocaleLowerCase());
      if (!S.month.trim() || S.month.length > 80) {
        toast('রোস্টারের শিরোনাম ১–৮০ অক্ষরের মধ্যে হতে হবে।', true);
        return;
      }
      if (S.days.length < 1 || S.days.length > 31) {
        toast('রোস্টারে ১ থেকে ৩১টি তারিখ থাকতে হবে।', true);
        return;
      }
      const rosterMonth = S.days[0]?.isoDate?.slice(0, 7);
      if (!rosterMonth || S.days.some(day => !/^\\d{4}-\\d{2}-\\d{2}$/.test(day.isoDate || '') || day.isoDate.slice(0, 7) !== rosterMonth)) {
        toast('সব তারিখ একই মাসের হতে হবে।', true);
        return;
      }
      if (S.employees.length > 100) {
        toast('একটি রোস্টারে সর্বোচ্চ ১০০ জন কর্মী রাখা যাবে।', true);
        return;
      }
      if (names.some(name => !name || name.length > 80)) {
        toast('প্রতিটি কর্মীর নাম ১–৮০ অক্ষরের মধ্যে হতে হবে।', true);
        return;
      }
      if (new Set(normalizedNames).size !== normalizedNames.length) {
        toast('প্রতিটি কর্মীর নাম আলাদা হতে হবে।', true);
        return;
      }
      S.updatedAt = new Date().toISOString();
      try {
        const targetMonth = S.days[0]?.isoDate?.slice(0, 7);
        if (!targetMonth) throw new Error('INVALID_ROSTER');
        const archiveCheck = await window.RosterAPI.request('/api/archive?month=' + encodeURIComponent(targetMonth), { cache: 'no-store' });
        if (archiveCheck.ok) throw new Error('MONTH_ARCHIVED');
        if (archiveCheck.status !== 404) throw new Error('ARCHIVE_CHECK_FAILED');
        await archiveIfNeeded();
        const r = await window.RosterAPI.request('/api/admin/save', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            data: S,
            expectedUpdatedAt: cleanSnapshot ? (JSON.parse(cleanSnapshot).updatedAt || null) : null
          })
        });
        const result = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(result.error || 'save failed');
        cleanSnapshot = snapshot(); dirty = false; paintHistory=[]; updateChangeUI();
        await refreshArchiveList(true);
        toast('রোস্টার নিরাপদ স্টোরেজে সংরক্ষিত');
      } catch (error) {
        if (error.message === 'MONTH_ARCHIVED') {
          toast('এই মাসটি আগে থেকেই Archive-এ সংরক্ষিত। পুরোনো মাসে নতুন করে Save করা যাবে না।', true);
        } else if (error.message === 'ARCHIVE_EXISTS') {
          toast('এই মাসের archive-এ ভিন্ন ডেটা আছে। সেটি যাচাই না করে Save বন্ধ রাখা হয়েছে।', true);
        } else if (error.message === 'ARCHIVE_CHECK_FAILED') {
          toast('Archive যাচাই করা যায়নি। সংযোগ ঠিক করে আবার চেষ্টা করুন।', true);
        } else if (error.message === 'WRITE_CONFLICT') {
          toast('অন্য Admin সেশন থেকে রোস্টার বদলেছে। আপনার পরিবর্তন JSON Download করে বর্তমান রোস্টার reload করুন।', true);
        } else if (error.message === 'SAVE_FAILED') {
          toast('Save করা যায়নি। সংযোগ যাচাই করে আবার চেষ্টা করুন।', true);
        } else {
          toast('Save করা যায়নি। Session বা server configuration পরীক্ষা করুন।', true);
        }
      }
    };

    $('theme').onclick = () => {
      localStorage.setItem('roster-display-mode', document.body.classList.contains('ink-mode') ? 'light' : 'ink');
      applyTheme();
    };

    let currentArchive = null;
    let archiveRequestId = 0;

    function validArchiveData(month, data) {
      if (!data || typeof data !== 'object' || !Array.isArray(data.days) ||
          !Array.isArray(data.employees) || !data.days.length || data.days.length > 31 ||
          data.employees.length > 100) return false;
      if (data.days[0]?.isoDate?.slice(0, 7) !== month) return false;
      if (!data.days.every(day => day && day.isoDate?.slice(0, 7) === month)) return false;
      return data.employees.every(emp => emp && Array.isArray(emp.shifts) &&
        emp.shifts.length === data.days.length &&
        emp.shifts.every(code => ['A', 'B', 'C', 'OFF', 'L'].includes(code)));
    }

    async function loadArchive(month) {
      const requestId = ++archiveRequestId;
      const download = $('downloadArchive');
      const preview = $('archivePreview');
      currentArchive = null;
      download.disabled = true;
      if (!month) {
        preview.textContent = 'দেখার জন্য একটি সংরক্ষিত মাস নির্বাচন করুন।';
        return;
      }
      preview.textContent = 'নিরাপদ Archive লোড হচ্ছে…';
      try {
        const response = await window.RosterAPI.request('/api/archive?month=' + encodeURIComponent(month), { cache: 'no-store' });
        const data = await response.json().catch(() => null);
        if (requestId !== archiveRequestId || $('archiveMonth').value !== month) return;
        if (!response.ok) {
          if (response.status === 404) throw new Error('এই Archive আর পাওয়া যাচ্ছে না। তালিকা রিফ্রেশ করুন।');
          throw new Error('Archive লোড করা যায়নি।');
        }
        if (!validArchiveData(month, data)) throw new Error('Archive ডেটার গঠন বা মাসের তারিখ সঠিক নয়।');

        currentArchive = { month, data };
        const counts = {};
        for (const employee of data.employees) {
          for (const code of employee.shifts) counts[code] = (counts[code] || 0) + 1;
        }
        const totalDuty = (counts.A || 0) + (counts.B || 0) + (counts.C || 0);
        preview.replaceChildren();

        const title = document.createElement('strong');
        title.textContent = (data.month || month) + ' · সংরক্ষিত Archive';
        preview.appendChild(title);

        const range = document.createElement('p');
        range.textContent = data.days[0].isoDate + ' — ' + data.days[data.days.length - 1].isoDate;
        range.style.margin = '4px 0 0';
        range.style.color = 'var(--muted)';
        preview.appendChild(range);

        const stats = document.createElement('div');
        stats.className = 'archive-stats';
        [['কর্মী', data.employees.length], ['তারিখ', data.days.length], ['মোট ডিউটি', totalDuty]].forEach(([label, value]) => {
          const card = document.createElement('div');
          card.className = 'archive-stat';
          const strong = document.createElement('strong');
          strong.textContent = value;
          const small = document.createElement('small');
          small.textContent = label;
          card.append(strong, small);
          stats.appendChild(card);
        });
        preview.appendChild(stats);

        const shifts = document.createElement('div');
        shifts.className = 'archive-shifts';
        Object.entries(counts).sort(([a], [b]) => a.localeCompare(b)).forEach(([code, count]) => {
          const item = document.createElement('span');
          item.textContent = code + ': ' + count;
          shifts.appendChild(item);
        });
        preview.appendChild(shifts);

        const tableWrap = document.createElement('div');
        tableWrap.className = 'archive-table-wrap';
        const table = document.createElement('table');
        table.className = 'archive-table';
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        const employeeHeading = document.createElement('th');
        employeeHeading.textContent = 'কর্মী';
        headerRow.appendChild(employeeHeading);
        for (const day of data.days) {
          const heading = document.createElement('th');
          heading.className = 'archive-day-heading';
          const dateLabel = document.createElement('span');
          dateLabel.className = 'archive-day-date';
          dateLabel.textContent = day.date || (day.isoDate ? String(Number(day.isoDate.slice(8, 10))) : '—');
          const weekdayLabel = document.createElement('small');
          weekdayLabel.className = 'archive-day-weekday';
          const weekdayNames = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
          const parsedDate = /^\d{4}-\d{2}-\d{2}$/.test(day.isoDate || '')
            ? new Date(day.isoDate + 'T00:00:00Z')
            : null;
          weekdayLabel.textContent = day.weekday || (parsedDate && !Number.isNaN(parsedDate.getTime())
            ? weekdayNames[parsedDate.getUTCDay()]
            : '—');
          heading.append(dateLabel, weekdayLabel);
          headerRow.appendChild(heading);
        }
        thead.appendChild(headerRow);
        table.appendChild(thead);
        const tbody = document.createElement('tbody');
        for (const employee of data.employees) {
          const row = document.createElement('tr');
          const name = document.createElement('th');
          name.scope = 'row';
          name.textContent = employee.name || '—';
          row.appendChild(name);
          for (const code of employee.shifts) {
            const cell = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = 'archive-shift-code shift-' + code.toLowerCase();
            badge.textContent = code;
            cell.appendChild(badge);
            row.appendChild(cell);
          }
          tbody.appendChild(row);
        }
        table.appendChild(tbody);
        tableWrap.appendChild(table);
        preview.appendChild(tableWrap);
        download.disabled = false;
      } catch (error) {
        if (requestId !== archiveRequestId) return;
        preview.textContent = error.message || 'Archive লোড করা যায়নি।';
      }
    }

    async function refreshArchiveList(preserveSelection = true) {
      const select = $('archiveMonth');
      const button = $('refreshArchives');
      const previous = preserveSelection ? select.value : '';
      button.disabled = true;
      button.textContent = 'লোড হচ্ছে…';
      try {
        const response = await window.RosterAPI.request('/api/archives?refresh=' + Date.now(), { cache: 'no-store' });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload || !Array.isArray(payload.months)) throw new Error('Archive তালিকা আনা যায়নি।');
        const months = [...new Set(payload.months.filter(month => /^\d{4}-(0[1-9]|1[0-2])$/.test(month)))].sort((a, b) => b.localeCompare(a));
        select.replaceChildren();
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = months.length ? 'মাস নির্বাচন করুন' : 'কোনো Archive নেই';
        select.appendChild(placeholder);
        for (const month of months) {
          const [year, monthNumber] = month.split('-').map(Number);
          const label = new Intl.DateTimeFormat('bn-BD', { month: 'long', year: 'numeric' })
            .format(new Date(Date.UTC(year, monthNumber - 1, 1)));
          const option = document.createElement('option');
          option.value = month;
          option.textContent = label + ' · ' + month;
          select.appendChild(option);
        }
        const selected = months.includes(previous) ? previous : (months[0] || '');
        select.value = selected;
        if (selected) await loadArchive(selected);
        else {
          archiveRequestId++;
          currentArchive = null;
          $('downloadArchive').disabled = true;
          $('archivePreview').textContent = 'এখনো কোনো মাসের Archive সংরক্ষিত নেই।';
        }
      } catch (error) {
        archiveRequestId++;
        currentArchive = null;
        $('downloadArchive').disabled = true;
        $('archivePreview').textContent = error.message || 'Archive তালিকা আনা যায়নি।';
        select.replaceChildren();
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'তালিকা পাওয়া যায়নি';
        select.appendChild(option);
      } finally {
        button.disabled = false;
        button.textContent = 'তালিকা রিফ্রেশ';
      }
    }

    $('archiveMonth').addEventListener('change', () => loadArchive($('archiveMonth').value));
    $('refreshArchives').addEventListener('click', () => refreshArchiveList(true));
    $('downloadArchive').addEventListener('click', () => {
      if (!currentArchive) return;
      const blob = new Blob([JSON.stringify(currentArchive.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'archive-' + currentArchive.month + '.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    applyTheme();
    load();
  </script>

</body>
</html>
