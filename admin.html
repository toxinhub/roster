<body data-required-role="admin">
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="রোস্টার এডমিন">
        <span class="brand-icon">⚙</span>
        <div>
          <strong>রোস্টার এডমিন</strong>
          <small>CCTV - PJL • ব্যবস্থাপনা</small>
        </div>
      </div>
      <div class="top-actions">
        <span id="status" class="status connected">Admin</span>
        <button class="icon-btn" id="theme" aria-label="থিম পরিবর্তন" title="Ink Mode">☀</button>
        <a class="back" href="index.html">লাইভ রোস্টার</a>
      </div>
    </header>

  <main class="page-shell">
      <section class="panel" id="roster-editor">
        <div class="section-head">
          <div>
            <span class="eyebrow">EDITOR</span>
            <h2 id="monthHead">রোস্টার সম্পাদনা</h2>
          </div>
          <div class="actions">
            <button id="addDay">+ তারিখ</button>
          </div>
        </div>

        <div class="form-grid">
          <label>রোস্টারের শিরোনাম<input id="month" maxlength="80"></label>
          <label>মাস ও সাল<input id="monthPicker" type="month"></label>
        </div>


        <div class="roster-tools" aria-label="Roster filters and bulk editing">
          <label>কর্মী খুঁজুন<input id="employeeSearch" type="search" placeholder="নাম লিখুন…" autocomplete="off"></label>
          <label>Shift Filter<select id="shiftFilter"><option value="ALL">সব Shift</option><option value="A">A Shift</option><option value="B">B Shift</option><option value="C">C Shift</option><option value="OFF">OFF</option><option value="L">Leave</option></select></label>
          <label>তারিখ<select id="bulkDate"></select></label>
          <label>নতুন Shift<select id="bulkShift"><option value="">Shift নির্বাচন</option></select></label>
          <button type="button" id="bulkApply">প্রয়োগ</button>
        </div>
        <p class="roster-result-count" id="rosterResultCount" aria-live="polite"></p>
        <div class="grid-scroll">
          <table id="editor"></table>
        </div>

        <div class="editor-meta"><span id="changeStatus" class="change-status clean">● কোনো পরিবর্তন নেই</span><button id="clearChanges" class="quiet" type="button" disabled>পরিবর্তন বাতিল</button></div><div id="changeSummary" class="change-summary" hidden></div>
        <div class="form-row" id="tools">
          <button class="primary" id="save">✓ নিরাপদে Save</button>
          <button id="download">JSON Download</button>
        </div>
      </section>

      <section class="panel" id="archive-history">
        <div class="section-head">
          <div><span class="eyebrow">HISTORY</span><h2>Archive & History</h2></div>
          <span class="muted">Read-only</span>
        </div>
        <div class="form-row archive-controls">
          <label>সংরক্ষিত মাস<select id="archiveMonth" aria-label="সংরক্ষিত Archive মাস"><option value="">Archive তালিকা লোড হচ্ছে…</option></select></label>
          <button id="refreshArchives" type="button">তালিকা রিফ্রেশ</button>
          <button id="downloadArchive" type="button" disabled>JSON Download</button>
        </div>
        <div id="archivePreview" class="archive-preview" role="status" aria-live="polite">সংরক্ষিত Archive খোঁজা হচ্ছে…</div>
      </section>
    </main>

  </div>

  <div id="toast" class="toast"></div>

  <script>
    let S = null;
    let sha = null;
    let cleanSnapshot = '';
    let dirty = false;
    const archivePending = new Map();
    const $ = id => document.getElementById(id);
    const key = 'cctv_roster_admin';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

    function toast(message, error = false) {
      const t = $('toast');
      t.textContent = message;
      t.className = 'toast show' + (error ? ' err' : '');
      setTimeout(() => t.className = 'toast', 3500);
    }

    function applyTheme() {
      const inkMode = localStorage.getItem('roster-display-mode') === 'ink';
      document.body.classList.toggle('ink-mode', inkMode);
      $('theme').textContent = inkMode ? '☀' : '☀';
      $('theme').setAttribute('aria-label', inkMode ? 'লাইট মোড' : 'ইঙ্ক মোড');
      $('theme').setAttribute('title', inkMode ? 'Light Mode' : 'Ink Mode');
      $('theme').setAttribute('aria-label', inkMode ? 'লাইট মোড' : 'ইঙ্ক মোড');
      $('theme').setAttribute('title', inkMode ? 'Light Mode' : 'Ink Mode');
    }

    function syncMonth() {
      const value = $('monthPicker').value;
      if (!value || !S) return;
      const [year, month] = value.split('-').map(Number);
      const monthName = new Intl.DateTimeFormat('bn-BD', { month: 'long', year: 'numeric' }).format(new Date(Date.UTC(year, month - 1, 1)));
      const weekdays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
      const toBangla = n => String(n).replace(/0/g,'০').replace(/1/g,'১').replace(/2/g,'২').replace(/3/g,'৩').replace(/4/g,'৪').replace(/5/g,'৫').replace(/6/g,'৬').replace(/7/g,'৭').replace(/8/g,'৮').replace(/9/g,'৯');
      const daysInMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();
      const oldDays = Array.isArray(S.days) ? S.days : [];
      const oldEmployees = Array.isArray(S.employees) ? S.employees : [];

      // Keep the latest unsaved snapshot whenever leaving a month.
      // Returning to a pending month restores its actual edits instead of
      // generating a blank roster or trapping the editor on the new month.
      const oldKey = oldDays[0]?.isoDate?.slice(0,7) || '';
      const newKey = value;
      if (oldKey && newKey && oldKey !== newKey) {
        archivePending.set(oldKey, JSON.parse(JSON.stringify(S)));
        if (archivePending.has(newKey)) {
          S = JSON.parse(JSON.stringify(archivePending.get(newKey)));
          archivePending.delete(newKey);
          $('month').value = S.month || '';
          $('monthHead').textContent = S.month || 'রোস্টার সম্পাদনা';
          render();
          markDirty();
          toast('অসম্পূর্ণ মাসের রোস্টারে ফিরে এসেছেন।');
          return;
        }
      }

      // Preserve shifts by actual ISO date and employee row identity.
      // Names are editable and may not be unique, so they must not be used as keys.
      const oldShiftByDate = oldEmployees.map(emp => {
        const map = new Map();
        oldDays.forEach((d, i) => {
          const code = Array.isArray(emp.shifts) ? emp.shifts[i] : null;
          if (d?.isoDate && code) map.set(d.isoDate, code);
        });
        return map;
      });

      S.month = monthName;
      S.days = Array.from({length:daysInMonth}, (_,i) => {
        const day = i + 1;
        const isoDate = year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
        const date = new Date(Date.UTC(year, month - 1, day));
        return {
          date: toBangla(day),
          weekday: weekdays[date.getUTCDay()],
          isoDate
        };
      });

      oldEmployees.forEach((emp, ei) => {
        const byDate = oldShiftByDate[ei] || new Map();
        emp.shifts = S.days.map(d => byDate.get(d.isoDate) || 'OFF');
      });

      $('month').value = monthName;
      $('monthHead').textContent = monthName;
      render();
      
      markDirty();
      toast(oldDays.length === daysInMonth
        ? 'মাস ও সাল অনুযায়ী তারিখ আপডেট হয়েছে'
        : daysInMonth + ' দিনের রোস্টার তৈরি হয়েছে');
    }

    function setPicker() {
      const match = String(S.month || '').match(/(\d{4})/);
      if (!match) return;
      const year = Number(match[1]);
      const months = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
      const monthIndex = months.findIndex(x => String(S.month).includes(x));
      if (monthIndex >= 0) {
        $('monthPicker').value = `${year}-${String(monthIndex + 1).padStart(2, '0')}`;
      }
    }

    async function load() {
      const auth = await window.RosterAuthReady();
      if (!auth?.authenticated || auth.role !== 'admin') return;
      try {
        const r = await window.RosterAPI.request('/api/roster?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('roster load failed');
        S = await r.json();
        $('month').value = S.month || '';
        $('monthHead').textContent = S.month || 'রোস্টার সম্পাদনা';
        render();
        
        setPicker();
        cleanSnapshot=snapshot(); dirty=false; updateChangeUI();
      } catch {
        toast('নিরাপদ সার্ভার থেকে রোস্টার লোড হয়নি', true);
      }
      await refreshArchiveList(false);
    }

    function snapshot(){return JSON.stringify(S);}
    function diffChanges(){
      if(!cleanSnapshot)return [];
      let before;
      try{before=JSON.parse(cleanSnapshot)}catch{return []}
      const out=[];
      if(before.month!==S.month) out.push('রোস্টার: '+(before.month||'—')+' → '+(S.month||'—'));
      const beforeDays=Array.isArray(before.days)?before.days:[], currentDays=Array.isArray(S.days)?S.days:[];
      const maxDays=Math.max(beforeDays.length,currentDays.length);
      for(let i=0;i<maxDays;i++){
        const a=beforeDays[i], b=currentDays[i];
        if(!a&&b) out.push('নতুন তারিখ: '+(b.date||i+1));
        else if(a&&!b) out.push('তারিখ বাদ: '+(a.date||i+1));
        else if(a&&b){
          if(a.date!==b.date) out.push('তারিখ '+(b.date||i+1)+': '+(a.date||'—')+' → '+(b.date||'—'));
          if(a.weekday!==b.weekday) out.push('দিন '+(b.date||i+1)+': '+(a.weekday||'—')+' → '+(b.weekday||'—'));
          if(a.isoDate!==b.isoDate) out.push('ISO তারিখ '+(b.date||i+1)+': '+(a.isoDate||'—')+' → '+(b.isoDate||'—'));
        }
      }
      const beforeEmployees=Array.isArray(before.employees)?before.employees:[], currentEmployees=Array.isArray(S.employees)?S.employees:[];
      const maxEmp=Math.max(beforeEmployees.length,currentEmployees.length);
      for(let ei=0;ei<maxEmp;ei++){
        const e=currentEmployees[ei], old=beforeEmployees[ei];
        if(!old&&e){out.push('নতুন কর্মী: '+(e.name||'নামহীন'));continue}
        if(old&&!e){out.push('কর্মী বাদ: '+(old.name||'নামহীন'));continue}
        if(!e||!old) continue;
        if(e.name!==old.name) out.push('কর্মী: '+(old.name||'নামহীন')+' → '+(e.name||'নামহীন'));
        const shifts=Array.isArray(e.shifts)?e.shifts:[], oldShifts=Array.isArray(old.shifts)?old.shifts:[];
        const maxShift=Math.max(shifts.length,oldShifts.length,currentDays.length);
        for(let di=0;di<maxShift;di++){
          const code=shifts[di], oldCode=oldShifts[di];
          if(code!==oldCode) out.push((e.name||'কর্মী')+' • '+(currentDays[di]?.date||beforeDays[di]?.date||di+1)+' তারিখ: '+(oldCode||'—')+' → '+(code||'—'));
        }
      }
      const beforeTypes=before.shiftTypes||{}, currentTypes=S.shiftTypes||{};
      [...new Set([...Object.keys(beforeTypes),...Object.keys(currentTypes)])].forEach(code=>{
        const a=beforeTypes[code], b=currentTypes[code];
        if(!a&&b) out.push('শিফট ধরন যোগ: '+code);
        else if(a&&!b) out.push('শিফট ধরন বাদ: '+code);
        else if(JSON.stringify(a)!==JSON.stringify(b)) out.push('শিফট ধরন পরিবর্তন: '+code);
      });
      return out;
    }
    function markDirty(){dirty=snapshot()!==cleanSnapshot;updateChangeUI()}
    function updateChangeUI(){const el=$('changeStatus'),summary=$('changeSummary');if(!el||!summary)return;const changes=diffChanges();el.textContent=dirty?`● ${changes.length||1}টি পরিবর্তন করা হয়েছে`:'● কোনো পরিবর্তন নেই';el.className='change-status '+(dirty?'dirty':'clean');$('clearChanges').disabled=!dirty;if(!dirty){summary.hidden=true;summary.innerHTML='';return}summary.hidden=false;summary.innerHTML='<strong>Save করার আগে পরিবর্তনগুলো:</strong><ul>'+changes.slice(0,12).map(x=>'<li>'+esc(x)+'</li>').join('')+(changes.length>12?'<li>আরও '+(changes.length-12)+'টি পরিবর্তন…</li>':'')+'</ul>'}

    function render() {
      $('monthHead').textContent = S.month || 'রোস্টার সম্পাদনা';
      $('month').value = S.month || '';

      const weekdayNames = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
      const h = '<tr><th>কর্মী</th>' + S.days.map((d, i) => {
        const isoDate = /^\d{4}-\d{2}-\d{2}$/.test(d.isoDate || '') ? d.isoDate : '';
        const dateValue = d.date || (isoDate ? String(Number(isoDate.slice(8, 10))) : '');
        const parsedDate = isoDate ? new Date(isoDate + 'T00:00:00.000Z') : null;
        const weekdayValue = d.weekday || (parsedDate && !Number.isNaN(parsedDate.getTime()) ? weekdayNames[parsedDate.getUTCDay()] : '');
        return `
        <th class="editor-day-heading">
          <input class="editor-day-date" type="text" inputmode="numeric" value="${esc(dateValue)}" data-day="${i}" aria-label="তারিখ">
          <input class="editor-day-weekday" type="text" value="${esc(weekdayValue)}" data-wd="${i}" readonly aria-label="বার" title="তারিখ অনুযায়ী স্বয়ংক্রিয়">
          <button class="remove" data-rmday="${i}">বাদ</button>
        </th>
      `;}).join('') + '</tr>';

      const b = S.employees.map((e, ei) => `
        <tr>
          <th>
            <input value="${esc(e.name)}" data-name="${ei}" maxlength="80" aria-label="কর্মীর নাম: ${esc(e.name)}">
            <button class="remove" data-rmemp="${ei}">বাদ</button>
          </th>
          ${e.shifts.map((c, di) => `<td><button class="edit" data-ei="${ei}" data-di="${di}">${esc(c)}</button></td>`).join('')}
        </tr>
      `).join('');

      $('editor').innerHTML = '<thead>' + h + '</thead><tbody>' + b + '</tbody>';
      const bulkDate = $('bulkDate');
      const previousDate = bulkDate.value;
      bulkDate.innerHTML = S.days.map((d,i) => '<option value="'+i+'">'+esc(d.date)+' · '+esc(d.weekday)+'</option>').join('');
      if (S.days.length) bulkDate.value = S.days.some((d,i)=>String(i)===previousDate) ? previousDate : '0';
      const bulkShift = $('bulkShift');
      const previousShift = bulkShift.value;
      bulkShift.innerHTML = '<option value="">Shift নির্বাচন</option>'+Object.entries(S.shiftTypes||{}).map(([code,v])=>'<option value="'+esc(code)+'">'+esc(code)+' — '+esc(v.label)+'</option>').join('');
      if (Object.prototype.hasOwnProperty.call(S.shiftTypes||{},previousShift)) bulkShift.value=previousShift;
      applyRosterFilters();

      $('editor').querySelectorAll('[data-day]').forEach(x => x.onchange = e => {
        const index = +e.target.dataset.day;
        const day = S.days[index];
        const entered = String(e.target.value || '').trim();
        const digits = entered.replace(/[০-৯]/g, digit => '0123456789'['০১২৩৪৫৬৭৮৯'.indexOf(digit)]);
        if (!digits || digits.length > 2 || [...digits].some(char => char < '0' || char > '9')) {
          toast('তারিখ ১ থেকে ৩১-এর মধ্যে লিখুন।', true);
          render();
          return;
        }
        const dayNumber = Number(digits);
        if (dayNumber < 1 || dayNumber > 31) {
          toast('তারিখ ১ থেকে ৩১-এর মধ্যে লিখুন।', true);
          render();
          return;
        }
        const selectedMonth = $('monthPicker').value;
        const baseIso = day?.isoDate || (selectedMonth ? selectedMonth + '-01' : '');
        if (baseIso.length !== 10) {
          toast('তারিখ পরিবর্তনের আগে মাস ও সাল নির্বাচন করুন।', true);
          render();
          return;
        }
        const yearMonth = baseIso.slice(0, 7);
        const isoDate = yearMonth + '-' + String(dayNumber).padStart(2, '0');
        const dateObject = new Date(isoDate + 'T00:00:00.000Z');
        if (!Number.isFinite(dateObject.getTime()) || dateObject.toISOString().slice(0, 10) !== isoDate) {
          toast('এই মাসে এমন কোনো তারিখ নেই।', true);
          render();
          return;
        }
        if (S.days.some((item, itemIndex) => itemIndex !== index && item.isoDate === isoDate)) {
          toast('এই তারিখটি রোস্টারে আগে থেকেই আছে।', true);
          render();
          return;
        }
        if ((index > 0 && isoDate <= S.days[index - 1].isoDate) ||
            (index < S.days.length - 1 && isoDate >= S.days[index + 1].isoDate)) {
          toast('তারিখগুলো ধারাবাহিক ক্রমে রাখতে হবে।', true);
          render();
          return;
        }
        const weekdays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
        day.date = entered;
        day.isoDate = isoDate;
        day.weekday = weekdays[dateObject.getUTCDay()];
        markDirty();
        render();
      });
      // Weekday is derived from ISO date and is intentionally read-only.
      $('editor').querySelectorAll('[data-name]').forEach(x => x.onchange = e => {
        const index=Number(e.target.dataset.name);
        const employee=S.employees[index];
        if(!employee)return;
        const value=String(e.target.value||'').trim();
        const duplicate=S.employees.some((other,i)=>i!==index&&String(other.name||'').trim().toLocaleLowerCase()===value.toLocaleLowerCase());
        if(!value||value.length>80||duplicate){
          e.target.value=employee.name;
          toast(!value?'কর্মীর নাম খালি রাখা যাবে না।':duplicate?'একই নামে একাধিক কর্মী রাখা যাবে না।':'কর্মীর নাম সর্বোচ্চ ৮০ অক্ষরের হতে হবে।',true);
          return;
        }
        employee.name=value;
        e.target.value=value;
        markDirty();
        applyRosterFilters();
      });
      $('editor').querySelectorAll('[data-rmday]').forEach(x => x.onclick = e => {
        const i = +e.target.dataset.rmday;
        S.days.splice(i, 1);
        S.employees.forEach(emp => emp.shifts.splice(i, 1));
        markDirty(); render(); 
      });
      $('editor').querySelectorAll('[data-rmemp]').forEach(x => x.onclick = e => {
        const index=+e.target.dataset.rmemp;
        const employee=S.employees[index];
        if(!employee)return;
        if(!confirm('কর্মী "'+employee.name+'"-কে বর্তমান রোস্টার থেকে বাদ দেবেন? পূর্বের archive অপরিবর্তিত থাকবে।'))return;
        S.employees.splice(index, 1);
        markDirty(); render(); 
      });
      $('editor').querySelectorAll('.edit').forEach(x => {
        x.onclick = () => pick(x);
        x.onkeydown = e => {
          const moves={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]};
          const move=moves[e.key]; if(!move)return;
          e.preventDefault();
          const nextEmployee=Number(x.dataset.ei)+move[0],nextDay=Number(x.dataset.di)+move[1];
          if(nextEmployee<0||nextEmployee>=S.employees.length||nextDay<0||nextDay>=S.days.length)return;
          const target=$('editor').querySelector('.edit[data-ei="'+nextEmployee+'"][data-di="'+nextDay+'"]');
          target?.focus();
        };
      });
    }

    function applyRosterFilters(){
      if(!S)return;
      const query=String($('employeeSearch')?.value||'').trim().toLocaleLowerCase();
      const shift=$('shiftFilter')?.value||'ALL';
      let shown=0;
      $('editor').querySelectorAll('tbody tr').forEach((row,ei)=>{
        const emp=S.employees[ei];
        const name=String(emp?.name||'').toLocaleLowerCase();
        const matchesName=!query||name.includes(query);

    function stableStringify(value) {

        if (existingResponse.ok) {
          const existing = await existingResponse.json().catch(() => null);
          if (stableStringify(existing) !== stableStringify(data)) {
            throw new Error('ARCHIVE_EXISTS');

          archivePending.delete(month);
          continue;

        if (existingResponse.status !== 404) {
          throw new Error('ARCHIVE_CHECK_FAILED');

        const r = await window.RosterAPI.request('/api/admin/archive', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ month, data })
        });
        const result = await r.json().catch(() => ({}));
        if (!r.ok) {
          // Another admin tab may have archived the same month after our check.
          if (r.status === 409 || result.error === 'ARCHIVE_EXISTS') {
            const verify = await window.RosterAPI.request(archiveUrl, { cache: 'no-store' });
            const saved = verify.ok ? await verify.json().catch(() => null) : null;
            if (stableStringify(saved) !== stableStringify(data)) {
              throw new Error('ARCHIVE_EXISTS');
            }
          } else {
            throw new Error(result.error || 'archive save failed');

        }
        archivePending.delete(month);

    box.className='panel';
    box.style.marginBottom='16px';
    box.innerHTML='<div class="section-head"><div><span class="eyebrow">ONE-TIME RECOVERY</span><h2>সেপ্টেম্বর ২০২৬ আর্কাইভ সংরক্ষণ</h2></div></div><p style="color:var(--muted);font-size:13px;line-height:1.6">বর্তমান প্রকাশ্য archive ফাইল থেকে সেপ্টেম্বরের রোস্টার নিরাপদ KV-তে কপি করবে। বর্তমান অক্টোবর রোস্টার বদলাবে না। কাজ সফল হওয়ার পর প্রকাশ্য archive ফাইল সরানো যাবে।</p><button id="importSeptemberArchive" class="primary" type="button">সেপ্টেম্বরের ডেটা নিরাপদে সংরক্ষণ</button><p id="archiveImportStatus" role="status" style="margin-top:8px;font-size:12px"></p>';
    shell.insertBefore(box,shell.firstChild);
    const button=box.querySelector('#importSeptemberArchive');
    const status=box.querySelector('#archiveImportStatus');
    button.addEventListener('click',async()=>{
      button.disabled=true; status.textContent='ডেটা কপি হচ্ছে…';
      try {
        const source=await fetch('archive/2026-09.json?recovery='+Date.now(),{cache:'no-store'});
        if(!source.ok) throw new Error('সেপ্টেম্বরের পুরোনো ফাইল পাওয়া যায়নি');
        const data=await source.json();
        const saved=await window.RosterAPI.request('/api/admin/archive',{
          method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',
          body:JSON.stringify({month:'2026-09',data})
        });
        const result=await saved.json().catch(()=>({}));
        if(!saved.ok) throw new Error(result.error==='ARCHIVE_EXISTS'?'সেপ্টেম্বরের আর্কাইভ আগে থেকেই সংরক্ষিত আছে':(result.error||'সংরক্ষণ করা যায়নি'));
        status.textContent='সেপ্টেম্বরের রোস্টার নিরাপদে সংরক্ষিত হয়েছে। এখন সাইটে গিয়ে সেপ্টেম্বর মাস খুলে যাচাই করো।';
        button.textContent='সংরক্ষণ সম্পন্ন'; 
      } catch(error) {
        status.textContent=error.message||'সংরক্ষণ করা যায়নি।';
        button.disabled=false;
      }
    });
  } catch {}
})();
</script>
</body>
</html>
