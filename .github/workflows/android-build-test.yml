name: Android Build Test

on:
  push:
    paths:
      - "android/**"
      - "schedule.json"
      - ".github/workflows/android-build-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate live roster data
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://toxinhub.github.io/roster/schedule.json"
          with urllib.request.urlopen(url, timeout=20) as r:
              data = json.load(r)
          assert isinstance(data.get("days"), list) and data["days"], "days missing"
          assert isinstance(data.get("employees"), list) and data["employees"], "employees missing"
          for employee in data["employees"]:
              assert employee.get("name"), "employee name missing"
              shifts = employee.get("shifts")
              assert isinstance(shifts, list), "employee shifts missing"
              assert len(shifts) >= len(data["days"]), f"shift array shorter than days for {employee['name']}"
              for code in shifts[:len(data["days"])]:
                  assert code in {"A","B","C","OFF","L",""}, f"invalid shift code: {code}"
          print(f"Validated {len(data['employees'])} employees and {len(data['days'])} days")
          PY

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: android
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Run Android lint
        working-directory: android
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify APK
        working-directory: android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CCTV-Roster-debug-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
